worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    # Métricas ficam disponíveis somente na API pela rede interna de observabilidade.
    location = /api/v1/metrics { access_log off; return 404; }
    location ^~ /api/ {
      proxy_pass http://pige360-api:8000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-ID $http_x_correlation_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
