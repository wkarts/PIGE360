schema_version: 1
product: PIGE360
first_party:
- {service: api, image: 'pige360-api:${PIGE360_IMAGE_TAG}', dockerfile: infra/docker/Dockerfile.api, required: true}
- {service: web, image: 'pige360-web:${PIGE360_IMAGE_TAG}', app: apps/tenant-admin-web, required: true}
- {service: platform-console, image: 'pige360-platform-console:${PIGE360_IMAGE_TAG}', app: apps/platform-console, required: true}
- {service: branding-studio, image: 'pige360-branding-studio:${PIGE360_IMAGE_TAG}', app: apps/branding-studio, required: false}
- {service: tenant-download-center, image: 'pige360-tenant-download-center:${PIGE360_IMAGE_TAG}', app: apps/tenant-download-center, required: false}
- {service: app-factory, image: 'pige360-app-factory:${PIGE360_IMAGE_TAG}', dockerfile: infra/docker/Dockerfile.api, required: false}
- {service: worker, image: 'pige360-worker:${PIGE360_IMAGE_TAG}', dockerfile: infra/docker/Dockerfile.worker, required: true}
- {service: migrations, image: local-build, dockerfile: infra/docker/Dockerfile.migrations, required: true}
- {service: builder-linux, image: 'pige360-builder-linux:${PIGE360_IMAGE_TAG}', profile: build-farm, required: false}
- {service: builder-android, image: 'pige360-builder-android:${PIGE360_IMAGE_TAG}', profile: build-farm, required: false}
third_party:
- {service: postgres-control, image: 'postgres:17.5-bookworm', required: true}
- {service: postgres-tenants, image: 'postgres:17.5-bookworm', required: true}
- {service: redis, image: 'redis:8.0.2-bookworm', required: true}
- {service: rabbitmq, image: 'rabbitmq:4.1.1-management', required: true}
- {service: minio, image: 'minio/minio:RELEASE.2025-05-24T17-08-30Z', required: true}
- {service: minio-init, image: 'minio/mc:RELEASE.2025-05-21T01-59-54Z', required: true}
- {service: clamav, image: 'clamav/clamav:1.4.2', profile: security, required: false}
- {service: cloudflared-control, image: 'cloudflare/cloudflared:2025.6.1', profile: cloudflare, required: false}
- {service: cloudflared-tenants, image: 'cloudflare/cloudflared:2025.6.1', profile: cloudflare, required: false}
- {service: otel-collector, image: 'otel/opentelemetry-collector-contrib:0.128.0', required: true}
- {service: prometheus, image: 'prom/prometheus:v3.4.1', required: true}
- {service: grafana, image: 'grafana/grafana:12.0.2', required: true}
- {service: loki, image: 'grafana/loki:3.5.1', required: true}
- {service: alloy, image: 'grafana/alloy:v1.19.2', overlay: deploy/compose/compose.logging.yaml, required: true}
- {service: edge, image: '${TRAEFIK_IMAGE:-traefik:v3.7.12}', overlay: deploy/compose/compose.edge.yaml, required: false}
notes:
  native_build_images: frozen_manual_only
  canonical_operational_front: apps/tenant-admin-web
