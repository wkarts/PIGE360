[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pige360-backend"
version = "1.0.0-alpha.1"
description = "Backend do PIGE360"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.128.2",
  "email-validator>=2.3,<3",
  "python-multipart>=0.0.32,<1",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.50",
  "alembic==1.18.4",
  "uvicorn==0.48.0",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=46,<47",
  "asn1crypto>=1.5,<2",
  "pypdf>=5.9,<6",
  "reportlab>=4.4,<5",
  "lxml==6.1.1",
]

[project.optional-dependencies]
production = [
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.5,<6",
  "redis>=6,<7",
  "boto3>=1.40,<2",
]
test = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
