name: pige360
services:
  pige360-postgres-control:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: platform_control
      POSTGRES_USER: pige360_control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_control_password
    secrets:
    - postgres_control_password
    volumes:
    - pige360-control-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pige360_control -d platform_control
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
  pige360-postgres-tenants:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: pige360_tenant_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_tenant_password
    secrets:
    - postgres_tenant_password
    volumes:
    - pige360-tenant-dbs:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pige360_tenant_admin -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
  pige360-redis:
    image: redis:8.0.2-bookworm
    command:
    - /bin/sh
    - -ec
    - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
    - pige360-redis:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$(cat /run/secrets/redis_password)" ping 2>/dev/null | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
    secrets:
    - redis_password
  pige360-rabbitmq:
    image: rabbitmq:4.1.1-management
    hostname: pige360-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pige360
      RABBITMQ_DEFAULT_VHOST: pige360
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    volumes:
    - pige360-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 15s
      timeout: 8s
      retries: 10
    networks:
    - pige360-data
    - pige360-observability
    restart: unless-stopped
    secrets:
    - rabbitmq_password
  pige360-minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    secrets:
    - minio_access_key
    - minio_secret_key
    volumes:
    - pige360-minio:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
  pige360-clamav:
    image: clamav/clamav:1.4.2
    profiles:
    - security
    volumes:
    - pige360-clamav:/var/lib/clamav
    healthcheck:
      test:
      - CMD-SHELL
      - printf 'PING\n' | nc -w 3 127.0.0.1 3310 | grep PONG
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
  pige360-minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      pige360-minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://pige360-minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
    secrets:
    - minio_access_key
    - minio_secret_key
    entrypoint:
    - /bin/sh
    - /opt/pige360/init-minio.sh
    volumes:
    - ./infra/scripts/init-minio.sh:/opt/pige360/init-minio.sh:ro
    networks:
    - pige360-data
    restart: 'no'
  pige360-app-init:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrations
    environment: &id001
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      REMOTE_CI_ENABLED: 'false'
      REMOTE_REGISTRY_ENABLED: 'false'
      REMOTE_RELEASE_ENABLED: 'false'
      REMOTE_DEPLOY_ENABLED: 'false'
      APP_JWT_SECRET_FILE: /run/secrets/app_jwt_secret
      APP_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      DATABASE_CONTROL_URL: postgresql+asyncpg://pige360_control@pige360-postgres-control:5432/platform_control
      DATABASE_TENANT_ADMIN_URL: postgresql+asyncpg://pige360_tenant_admin@pige360-postgres-tenants:5432/postgres
      REDIS_URL: redis://pige360-redis:6379/0
      RABBITMQ_URL: amqp://pige360@pige360-rabbitmq:5672/pige360
      MINIO_ENDPOINT: http://pige360-minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://pige360-otel-collector:4317
      DATABASE_CONTROL_PASSWORD_FILE: /run/secrets/postgres_control_password
      DATABASE_TENANT_ADMIN_PASSWORD_FILE: /run/secrets/postgres_tenant_password
      DATABASE_SECRET_KEY_FILE: /run/secrets/database_secret_key
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      WORKER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/worker_context_signing_key
      BUILD_FARM_TOKEN_FILE: /run/secrets/build_farm_token
    depends_on:
      pige360-postgres-control:
        condition: service_healthy
      pige360-postgres-tenants:
        condition: service_healthy
      pige360-minio-init:
        condition: service_completed_successfully
    secrets:
    - app_jwt_secret
    - bootstrap_token
    - minio_access_key
    - minio_secret_key
    - postgres_control_password
    - postgres_tenant_password
    - database_secret_key
    - redis_password
    - rabbitmq_password
    - worker_context_signing_key
    - build_farm_token
    command:
    - /opt/pige360/infra/scripts/app-init.sh
    volumes:
    - pige360-tenant-storage:/var/lib/pige360/tenants
    networks:
    - pige360-data
    restart: 'no'
  pige360-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    image: pige360-api:1.0.0
    environment: *id001
    secrets: &id002
    - app_jwt_secret
    - bootstrap_token
    - minio_access_key
    - minio_secret_key
    - postgres_control_password
    - postgres_tenant_password
    - database_secret_key
    - redis_password
    - rabbitmq_password
    - worker_context_signing_key
    - build_farm_token
    depends_on: &id003
      pige360-postgres-control:
        condition: service_healthy
      pige360-postgres-tenants:
        condition: service_healthy
      pige360-redis:
        condition: service_healthy
      pige360-rabbitmq:
        condition: service_healthy
      pige360-minio:
        condition: service_healthy
      pige360-app-init:
        condition: service_completed_successfully
    volumes:
    - pige360-tenant-storage:/var/lib/pige360/tenants
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
    - pige360-app
    - pige360-data
    - pige360-observability
    - pige360-build-farm
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
  pige360-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_DIR: apps/tenant-admin-web
    image: pige360-web:1.0.0
    depends_on:
      pige360-api:
        condition: service_healthy
    ports:
    - ${WEB_BIND_HOST:-127.0.0.1}:${WEB_PUBLISHED_PORT:-58080}:8080
    networks:
    - pige360-app
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /var/cache/nginx
    - /var/run
  pige360-platform-console:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_DIR: apps/platform-console
    image: pige360-platform-console:1.0.0
    networks:
    - pige360-app
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /var/cache/nginx
    - /var/run
  pige360-branding-studio:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_DIR: apps/branding-studio
    image: pige360-branding-studio:1.0.0
    networks:
    - pige360-app
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /var/cache/nginx
    - /var/run
  pige360-tenant-download-center:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_DIR: apps/tenant-download-center
    image: pige360-tenant-download-center:1.0.0
    networks:
    - pige360-app
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /var/cache/nginx
    - /var/run
  pige360-app-factory-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    image: pige360-app-factory:1.0.0
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      REMOTE_CI_ENABLED: 'false'
      REMOTE_REGISTRY_ENABLED: 'false'
      REMOTE_RELEASE_ENABLED: 'false'
      REMOTE_DEPLOY_ENABLED: 'false'
      APP_JWT_SECRET_FILE: /run/secrets/app_jwt_secret
      APP_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      DATABASE_CONTROL_URL: postgresql+asyncpg://pige360_control@pige360-postgres-control:5432/platform_control
      DATABASE_TENANT_ADMIN_URL: postgresql+asyncpg://pige360_tenant_admin@pige360-postgres-tenants:5432/postgres
      REDIS_URL: redis://pige360-redis:6379/0
      RABBITMQ_URL: amqp://pige360@pige360-rabbitmq:5672/pige360
      MINIO_ENDPOINT: http://pige360-minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
