      DATABASE_SECRET_KEY_FILE: /run/secrets/database_secret_key
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      WORKER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/worker_context_signing_key
      BUILD_FARM_TOKEN_FILE: /run/secrets/build_farm_token
    secrets: *id002
    depends_on: *id003
    networks:
    - pige360-app
    - pige360-data
    - pige360-build-farm
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:size=512m,mode=1777
  pige360-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    image: pige360-worker:1.0.0
    command:
    - celery
    - -A
    - app.worker
    - beat
    - --loglevel=INFO
    environment: *id001
    secrets: *id002
    depends_on: *id003
    networks:
    - pige360-data
    - pige360-observability
    restart: unless-stopped
  pige360-worker-app-builds:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    image: pige360-worker:1.0.0
    command:
    - celery
    - -A
    - app.worker
    - worker
    - --loglevel=INFO
    - --queues=app-builds
    - --hostname=app-builds@%h
    environment:
      APP_ENV: ${APP_ENV:-production}
