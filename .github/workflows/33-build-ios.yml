name: 33 · iOS app/xcarchive/IPA
'on':
  pull_request:
    paths:
      - 'apps/family-app/**'
      - 'apps/teacher-app/**'
      - 'apps/student-app/**'
      - 'apps/admin-app/**'
      - 'apps/pos-app/**'
      - 'rust/**'
      - 'scripts/mobile/**'
      - '.github/workflows/33-build-ios.yml'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      sign: {type: boolean, required: false, default: false}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Construir aplicações iOS
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_DEVELOPMENT_TEAM }}
        run: bash scripts/mobile/build-ios.sh
      - name: Avaliar assinatura iOS (opcional)
        env:
          SIGN_REQUESTED: ${{ inputs.sign }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/mobile/sign-ios.sh
      - uses: actions/upload-artifact@v4
        with: {name: ios-app-xcarchive-ipa, path: release/artifacts/ios/**, if-no-files-found: error}
