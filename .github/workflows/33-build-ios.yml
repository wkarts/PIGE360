name: 33 · iOS app/xcarchive/IPA
'on':
  pull_request:
  workflow_dispatch:
    inputs:
      sign: {type: boolean, required: false, default: false}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/mobile/build-ios.sh
      - name: Assinar quando configurado
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign == true && secrets.APPLE_SIGNING_CERTIFICATE_BASE64 != '' }}
        run: bash scripts/mobile/sign-ios.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with: {name: ios-app-xcarchive-ipa, path: release/artifacts/ios/**, if-no-files-found: error}
