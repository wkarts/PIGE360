name: 03 · Git Flow

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  topology:
    name: Validar topologia de branches
    runs-on: ubuntu-24.04
    steps:
      - name: Validar origem e destino do Pull Request
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Validando Git Flow: $HEAD -> $BASE"

          case "$BASE" in
            main)
              case "$HEAD" in
                release/*|hotfix/*) exit 0 ;;
                *)
                  echo "::error::A main aceita somente PRs originadas de release/* ou hotfix/*."
                  exit 1
                  ;;
              esac
              ;;
            dev)
              case "$HEAD" in
                feature/*|fix/*|chore/*|refactor/*|docs/*|ci/*|test/*|perf/*|main) exit 0 ;;
                *)
                  echo "::error::A dev aceita branches de trabalho padronizadas ou back-merge da main."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Pull Requests devem ter como base dev ou main. Base recebida: $BASE"
              exit 1
              ;;
          esac
