name: 20 · Imagens de aplicação
'on':
  pull_request:
  workflow_dispatch:
    inputs:
      enable_remote_registry: {type: boolean, required: false, default: false}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [api,web,worker,migrations,reporting]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem-base API quando o target herda dela
        if: ${{ matrix.target == 'worker' || matrix.target == 'migrations' || matrix.target == 'reporting' }}
        run: docker build -f infra/docker/Dockerfile.api -t pige360-api:1.0.0 .
      - name: Construir imagem de aplicação
        run: docker build -f infra/docker/Dockerfile.${{ matrix.target }} -t pige360-${{ matrix.target }}:1.0.0 .
      - run: docker image inspect pige360-${{ matrix.target }}:1.0.0 > release/${{ matrix.target }}-inspect.json
  remote-publish-disabled:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_remote_registry == true && vars.REMOTE_REGISTRY_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    environment: remote-registry
    steps:
      - run: echo 'Upload remoto deliberadamente condicionado e desabilitado por padrão.'
