name: 04 · Sincronizar metadados SemVer

on:
  push:
    branches:
      - 'ci/connectapi-release-model'
    paths:
      - VERSION
      - 'scripts/release/sync-version.py'
      - 'scripts/validation/validate_version_consistency.py'
      - '.github/workflows/04-version-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar versão canônica
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Sincronizar manifests e validar
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/release/sync-version.py "$version"
          python3 scripts/validation/validate_version_consistency.py --output release/version-consistency.json
      - name: Persistir sincronização
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nenhum metadado precisava de sincronização.'
            exit 0
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(version): sincroniza metadados para ${version} [skip release]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
