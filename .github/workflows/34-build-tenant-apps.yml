name: 34 · Apps white-label por tenant
'on':
  pull_request:
  workflow_dispatch:
    inputs:
      manifest:
        description: Caminho do tenant-app-manifest.yaml
        required: true
        default: deploy/local/tenant-app-manifest.demo.yaml
      publish_stores: {type: boolean, required: false, default: false}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TENANT_MANIFEST: ${{ inputs.manifest || 'deploy/local/tenant-app-manifest.demo.yaml' }}
jobs:
  validate-manifest:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.lock.txt}
      - run: python -m pip install -r backend/requirements.lock.txt
      - id: matrix
        shell: bash
        run: python scripts/validation/tenant_app_manifest.py "$TENANT_MANIFEST" --github-output
  build:
    needs: validate-manifest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate-manifest.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.lock.txt}
      - run: python -m pip install -r backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0', cache: npm, cache-dependency-path: package-lock.json}
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with: {distribution: temurin, java-version: '21'}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'pwa'
      - name: Dependências Linux Tauri
        if: matrix.platform == 'linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build white-label
        shell: bash
        run: bash scripts/mobile/build-tenant-app.sh "$TENANT_MANIFEST" "${{ matrix.app }}" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with: {name: 'tenant-${{ matrix.app }}-${{ matrix.platform }}', path: release/artifacts/tenant-apps/**, if-no-files-found: error}
  publish-stores-disabled:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stores == true && vars.INTEGRATION_REMOTE_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    environment: app-stores
    steps:
      - run: echo 'Publicação em lojas permanece condicionada a credenciais e opt-in explícito.'
