name: 00 · CI local reproduzível
'on':
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.lock}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - run: python -m pip install -r backend/requirements.lock
      - name: Executar validação integral com progresso visível
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/ci/run-all.sh --ci &
          ci_pid=$!
          started_at=$(date +%s)

          heartbeat() {
            while kill -0 "$ci_pid" 2>/dev/null; do
              sleep 60
              if kill -0 "$ci_pid" 2>/dev/null; then
                now=$(date +%s)
                elapsed=$((now - started_at))
                printf '[CI] validação integral ainda em execução — %dm%02ds decorridos\n' "$((elapsed / 60))" "$((elapsed % 60))"
              fi
            done
          }

          heartbeat &
          heartbeat_pid=$!

          set +e
          wait "$ci_pid"
          status=$?
          set -e

          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          exit "$status"
