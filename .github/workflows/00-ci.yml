name: 00 · CI local reproduzível
'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.lock.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Gerar e versionar package-lock raiz quando ausente
        if: github.event_name == 'pull_request' && hashFiles('package-lock.json') == '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          npm install --package-lock-only --workspaces --include-workspace-root --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          CONTENT="$(base64 -w0 package-lock.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/package-lock.json" \
            -f message='chore(deps): versionar package-lock raiz reproduzível' \
            -f content="$CONTENT" \
            -f branch="$HEAD_REF"
          echo 'package-lock.json versionado; a nova execução da PR validará npm ci.'
          exit 0
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: bash scripts/ci/run-all.sh --ci
