name: 61 · Bundle self-hosted
'on':
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.lock.txt}
      - run: python -m pip install -r backend/requirements.lock.txt
      - name: Gerar evidências necessárias ao bundle
        run: |
          python scripts/backup/test_backup_restore.py
          python scripts/oci/build_structural_oci.py
          python scripts/release/generate_evidence_pdf.py
      - run: bash scripts/release/build-self-hosted.sh
      - run: test -s release/output/PIGE360-1.0.0-self-hosted.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with: {name: pige360-self-hosted, path: release/output/PIGE360-1.0.0-self-hosted.zip, if-no-files-found: error}
