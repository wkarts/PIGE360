name: 61 · Bundle self-hosted
'on':
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: bash scripts/release/build-self-hosted.sh
      - run: test -n "$(find release/output -maxdepth 1 -type f -name '*self-hosted.zip' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with: {name: pige360-self-hosted, path: release/output/*self-hosted.zip, if-no-files-found: error}
