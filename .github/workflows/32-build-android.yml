name: 32 · Android APK/AAB
'on':
  pull_request:
    paths:
      - 'apps/family-app/**'
      - 'apps/teacher-app/**'
      - 'apps/student-app/**'
      - 'apps/admin-app/**'
      - 'apps/pos-app/**'
      - 'apps/kiosk-app/**'
      - 'apps/timeclock-app/**'
      - 'rust/**'
      - 'scripts/mobile/**'
      - '.github/workflows/32-build-android.yml'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      sign: {type: boolean, required: false, default: false}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - uses: android-actions/setup-android@v3
      - name: Fixar e expor Android NDK para o Tauri
        shell: bash
        run: |
          ndk_version='27.3.13750724'
          ndk_home="$ANDROID_HOME/ndk/$ndk_version"
          if [ ! -d "$ndk_home" ]; then
            sdkmanager --install "ndk;$ndk_version"
          fi
          test -d "$ndk_home"
          printf 'NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: bash scripts/mobile/build-android.sh
      - name: Avaliar assinatura Android (opcional)
        env:
          SIGN_REQUESTED: ${{ inputs.sign }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/mobile/sign-android.sh
      - uses: actions/upload-artifact@v4
        with: {name: android-apk-aab, path: release/artifacts/android/**, if-no-files-found: error}
