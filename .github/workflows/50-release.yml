name: 50 · Pré-lançamento Alpha Web/Server

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validar promoção de versão
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      tag: ${{ steps.release_version.outputs.tag }}
      publishable: ${{ steps.release_version.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
      - name: Garantir que a promoção ocorreu na main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Validar versão canônica e metadados de produto
        run: python3 scripts/validation/validate_version_consistency.py --output release/version-consistency.json
      - id: release_version
        name: Expor versão, tag e estado da promoção
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'publishable=false\n' >> "$GITHUB_OUTPUT"
            echo "A release $tag já existe; a promoção será ignorada."
          else
            printf 'publishable=true\n' >> "$GITHUB_OUTPUT"
            echo "A release $tag ainda não existe; a promoção web/server será executada."
          fi

  validation:
    name: Gates de qualidade
    needs: [version]
    if: needs.version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências e executar validações integrais
        run: |
          python -m pip install -r backend/requirements.lock
          bash scripts/ci/run-all.sh --ci
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-validation
          path: |
            release/reports/**
            release/*validation*.json
            release/project-validation.json
          if-no-files-found: error

  runtime_images:
    name: Imagens de runtime e smoke Compose
    needs: [version, validation]
    if: needs.version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagens Docker da versão
        run: bash scripts/oci/build-runtime-images.sh all release/artifacts/docker/runtime
      - name: Executar smoke test isolado do Compose
        run: bash scripts/ci/smoke-compose-homologation.sh release/artifacts/docker/compose-smoke
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pige360-${{ needs.version.outputs.version }}-runtime-images
          path: release/artifacts/docker/**
          if-no-files-found: error

  web_pwa:
    name: PWAs das 13 aplicações
    needs: [version, validation]
    if: needs.version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Gerar PWAs versionadas
        run: bash scripts/release/package-web-pwa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-web-pwa
          path: release/artifacts/web/**
          if-no-files-found: error

  release_bundle:
    name: Pacotes auto-hospedados, fontes e evidências
    needs: [version, validation, runtime_images]
    if: needs.version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reproduzir evidências que compõem o pacote
        run: |
          python -m pip install -r backend/requirements.lock
          bash scripts/ci/run-all.sh --ci
      - name: Gerar ZIPs de fonte, self-hosted e CI/CD
        run: bash scripts/release/package-local.sh --output-dir release/output
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-release-bundle
          path: release/output/**
          if-no-files-found: error

  publish:
    name: Criar GitHub Release sem binários nativos
    needs: [version, validation, runtime_images, web_pwa, release_bundle]
    if: >-
      ${{ always() && needs.version.outputs.publishable == 'true' &&
          needs.validation.result == 'success' &&
          needs.runtime_images.result == 'success' &&
          needs.web_pwa.result == 'success' &&
          needs.release_bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pige360-${{ needs.version.outputs.version }}-*
          path: release/publish
          merge-multiple: true
      - name: Bloquear publicação acidental de binários mobile/desktop
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(find release/publish -type f \
            \( -iname '*.apk' -o -iname '*.aab' -o -iname '*.ipa' -o -iname '*.dmg' \
               -o -iname '*.msi' -o -iname '*.exe' -o -iname '*.appimage' -o -iname '*.deb' \
               -o -iname '*.rpm' \) -print)"
          if [ -n "$forbidden" ]; then
            echo "::error::Binários mobile/desktop não podem compor a release automática."
            printf '%s\n' "$forbidden"
            exit 1
          fi
      - name: Consolidar checksums dos assets publicados
        run: |
          find release/publish -type f -print0 | sort -z | xargs -0 sha256sum > "release/publish/PIGE360-${{ needs.version.outputs.version }}-release-assets-SHA256SUMS"
      - name: Registrar notas do pré-lançamento
        shell: bash
        run: |
          cat > release/RELEASE_NOTES.md <<'EOF'
          ## PIGE360 ${{ needs.version.outputs.version }}

          Pré-lançamento Alpha promovido pela `main` após integração pela `dev`.

          Inclui as 13 aplicações em PWA, pacotes self-hosted, fontes, imagens de
          runtime/Compose, evidências, SBOM/proveniência disponíveis no bundle e
          checksums de integridade.

          **Binários mobile e desktop estão deliberadamente desativados neste
          canal de release.** APK/AAB/IPA e instaladores desktop não são gerados
          nem anexados automaticamente. Os workflows nativos permanecem
          disponíveis somente para execução manual de desenvolvimento e
          homologação, sem fazer parte da release canônica.
          EOF
      - name: Publicar tag e GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_RELEASE_ENABLED: 'true'
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_NOTES_FILE: release/RELEASE_NOTES.md
        run: bash scripts/release/publish-github-release.sh release/publish
