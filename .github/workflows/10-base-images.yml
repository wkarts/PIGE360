name: 10 · Imagens base Docker

on:
  pull_request:
    paths:
      - 'infra/docker/base/**'
      - 'scripts/oci/**'
      - 'VERSION'
  push:
    branches: [develop]
    paths:
      - 'infra/docker/base/**'
      - 'scripts/oci/**'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagens base executáveis
        run: bash scripts/oci/build-runtime-images.sh base release/artifacts/docker/base
      - name: Validar manifesto das imagens base
        run: |
          test -s release/artifacts/docker/base/images-manifest.json
          test "$(find release/artifacts/docker/base -name '*.tar' | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-base-images-${{ github.run_id }}
          path: release/artifacts/docker/base/**
          if-no-files-found: error
