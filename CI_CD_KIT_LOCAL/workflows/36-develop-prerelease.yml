name: 36 · Develop prerelease com Deployer x64

'on':
  workflow_run:
    workflows:
      - 00 · CI local reproduzível
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pige360-develop-prerelease
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DEPLOYER_DIR: tools/pige360-deployer
  AGENT_TARGET: x86_64-unknown-linux-gnu

jobs:
  gate:
    name: Exigir CI verde da develop
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop'
      )
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$GITHUB_REF" != 'refs/heads/develop' ]; then
            echo 'O disparo manual deve usar a branch develop.' >&2
            exit 2
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'O commit de origem não é um SHA-1 Git válido.' >&2
            exit 2
          }
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  agent:
    name: Agente Linux AMD64
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/pige360-deployer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.AGENT_TARGET }}
      - name: Validar fontes do implantador
        working-directory: tools/pige360-deployer
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run ci:version
          npm run validate:deployer
          npm run typecheck
          npm run build:web
      - name: Testar e compilar agente
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path "$DEPLOYER_DIR/src-tauri/Cargo.toml" --locked --no-default-features --lib
          cargo build --manifest-path "$DEPLOYER_DIR/src-tauri/Cargo.toml" --locked --release \
            --no-default-features --bin pige360-deploy-agent --target "$AGENT_TARGET"
          install -D -m 0755 \
            "$DEPLOYER_DIR/src-tauri/target/$AGENT_TARGET/release/pige360-deploy-agent" \
            build/deployer-agent/pige360-deploy-agent-linux-amd64
          build/deployer-agent/pige360-deploy-agent-linux-amd64 self-test
          short_sha="${{ needs.gate.outputs.sha }}"
          short_sha="${short_sha:0:12}"
          mkdir -p release/deployer-agent
          tar -C build/deployer-agent -czf \
            "release/deployer-agent/PIGE360-Deployer-Agent-develop-${short_sha}-linux-x64.tar.gz" \
            pige360-deploy-agent-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: develop-deployer-agent-embedded
          path: build/deployer-agent/pige360-deploy-agent-linux-amd64
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: develop-deployer-agent-linux-x64
          path: release/deployer-agent/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Deployer ${{ matrix.label }}
    needs: [gate, agent]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            platform: windows-x64
          - label: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            platform: linux-x64
          - label: macOS Intel x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            platform: macos-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Instalar dependências Tauri no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/pige360-deployer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: develop-deployer-agent-embedded
          path: tools/pige360-deployer/src-tauri/embedded
      - name: Construir instalador x64
        working-directory: tools/pige360-deployer
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/tools/pige360-deployer/src-tauri/target
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npm run tauri -- build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          short_sha="${{ needs.gate.outputs.sha }}"
          short_sha="${short_sha:0:12}"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          test -d "$bundle"
          mkdir -p "$GITHUB_WORKSPACE/release/deployer"
          tar -C "$bundle" -czf \
            "$GITHUB_WORKSPACE/release/deployer/PIGE360-Deployer-develop-${short_sha}-${{ matrix.platform }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: develop-deployer-${{ matrix.platform }}
          path: release/deployer/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  source:
    name: Fonte e deployments da revisão
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}
      - name: Gerar pacotes imutáveis
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ needs.gate.outputs.sha }}'
          short_sha="${source_sha:0:12}"
          mkdir -p release/develop
          git archive --format=zip --output="release/develop/PIGE360-develop-${short_sha}-source.zip" "$source_sha"
          git archive --format=zip --prefix=PIGE360-deployments/ \
            --output="release/develop/PIGE360-develop-${short_sha}-deployments.zip" \
            "$source_sha" -- .env.example compose.yaml compose.production.yaml deploy deployments scripts/deploy scripts/oci
      - uses: actions/upload-artifact@v4
        with:
          name: develop-platform-source
          path: release/develop/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar prerelease imutável da develop
    needs: [gate, agent, desktop, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: develop-*
          path: artifacts
      - name: Consolidar assets e checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            test ! -e "release-assets/$name" || { echo "Asset duplicado: $name" >&2; exit 4; }
            cp "$asset" "release-assets/$name"
          done < <(find artifacts -type f -print0 | sort -z)
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
      - name: Criar prerelease uma única vez
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          tag="develop-${short_sha}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A prerelease imutável $tag já existe; os assets não serão sobrescritos." >&2
            exit 5
          fi
          gh release create "$tag" --target "$SOURCE_SHA" --prerelease \
            --title "PIGE360 develop ${short_sha}" \
            --notes "Homologação imutável da develop em ${SOURCE_SHA}. Não utilizar em produção." \
            release-assets/*
