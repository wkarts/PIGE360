name: 80 · Inventário de dependências
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python scripts/supply-chain/toolchain_inventory.py --output release/dependency-inventory.json
      - run: python scripts/supply-chain/generate_sbom.py
      - uses: actions/upload-artifact@v4
        with: {name: dependency-inventory, path: 'release/*sbom*.json
release/dependency-inventory.json', if-no-files-found: error}
