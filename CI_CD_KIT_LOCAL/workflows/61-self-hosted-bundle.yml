name: 61 · Bundle self-hosted
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: bash scripts/release/build-self-hosted.sh
      - uses: actions/upload-artifact@v4
        with: {name: pige360-self-hosted, path: release/output/*self-hosted.zip, if-no-files-found: error}
