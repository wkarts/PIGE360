name: 20 · Imagens Docker de aplicação

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'apps/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'infra/compose/**'
      - 'scripts/ci/**'
      - 'scripts/oci/**'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'apps/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'infra/compose/**'
      - 'scripts/ci/**'
      - 'scripts/oci/**'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir bases e imagens executáveis
        id: runtime_images
        run: bash scripts/oci/build-runtime-images.sh all release/artifacts/docker/runtime
      - name: Validar inventário e arquivos exportados
        run: |
          test -s release/artifacts/docker/runtime/images-manifest.json
          test "$(find release/artifacts/docker/runtime -name '*.tar' | wc -l)" -eq 9
          sha256sum --check release/artifacts/docker/runtime/*.tar.sha256
      - name: Executar smoke test isolado do Compose
        run: bash scripts/ci/smoke-compose-homologation.sh release/artifacts/docker/compose-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-runtime-images-${{ github.run_id }}
          path: release/artifacts/docker/**
          if-no-files-found: error
