name: 50 · Pré-lançamento Alpha

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - 'apps/**'
      - 'backend/**'
      - 'packages/**'
      - 'rust/**'
      - 'infra/docker/**'
      - 'compose*.yaml'
      - 'scripts/desktop/**'
      - 'scripts/mobile/**'
      - 'scripts/oci/**'
      - 'scripts/release/**'
      - 'scripts/validation/**'
      - '.github/workflows/50-release.yml'
  workflow_dispatch:
    inputs:
      distribution_mode:
        description: "Canal de distribuição: homologação instalável ou publicação em lojas"
        type: choice
        options: [homologation, store]
        default: homologation

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validar promoção de versão
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      tag: ${{ steps.release_version.outputs.tag }}
      publishable: ${{ steps.release_version.outputs.publishable }}
      distribution_mode: ${{ steps.release_version.outputs.distribution_mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Garantir que a promoção ocorreu na main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Validar a versão canônica e os metadados de produto
        run: python3 scripts/validation/validate_version_consistency.py --output release/version-consistency.json
      - id: release_version
        name: Expor versão, tag e estado da promoção
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          distribution_mode="${{ github.event.inputs.distribution_mode || 'homologation' }}"
          case "$distribution_mode" in
            homologation|store) ;;
            *) echo "Canal de distribuição inválido: $distribution_mode" >&2; exit 2 ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'distribution_mode=%s\n' "$distribution_mode" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'publishable=false\n' >> "$GITHUB_OUTPUT"
            echo "A release $tag já existe; a matriz de promoção será ignorada."
          else
            printf 'publishable=true\n' >> "$GITHUB_OUTPUT"
            echo "A release $tag ainda não existe; a matriz de promoção será executada."
          fi

  signing_preflight:
    name: Pré-verificar credenciais de publicação em lojas
    needs: version
    if: needs.version.outputs.publishable == 'true' && needs.version.outputs.distribution_mode == 'store'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recusar publicação em loja sem materiais de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          missing=0
          for variable in \
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            APPLE_DEVELOPMENT_TEAM APPLE_SIGNING_CERTIFICATE_BASE64 APPLE_SIGNING_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!variable}" ]; then
              echo "::error::Publicação em loja bloqueada: configure $variable antes de construir artefatos publicáveis."
              missing=1
            fi
          done
          exit "$missing"

  validation:
    name: Gates de qualidade
    needs: [version]
    if: needs.version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências e executar validações integrais
        run: |
          python -m pip install -r backend/requirements.lock
          bash scripts/ci/run-all.sh --ci
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-validation
          path: |
            release/reports/**
            release/*validation*.json
            release/project-validation.json
          if-no-files-found: error

  runtime_images:
    name: Imagens de runtime e smoke Compose
    needs: [version, validation]
    if: needs.version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagens Docker da versão
        run: bash scripts/oci/build-runtime-images.sh all release/artifacts/docker/runtime
      - name: Executar smoke test isolado do Compose
        run: bash scripts/ci/smoke-compose-homologation.sh release/artifacts/docker/compose-smoke
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pige360-runtime-images-${{ github.run_id }}
          path: release/artifacts/docker/**
          if-no-files-found: error

  web_pwa:
    name: PWAs das 13 aplicações
    needs: [version, validation]
    if: needs.version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Gerar PWAs versionadas
        run: bash scripts/release/package-web-pwa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-web-pwa
          path: release/artifacts/web/**
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: [version, validation]
    if: needs.version.outputs.publishable == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: windows-2025
            target: i686-pc-windows-msvc
            label: windows-x86
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            label: macos-x64
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Preparar Perl completo para OpenSSL no Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = Join-Path $env:SystemDrive 'Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) {
            choco install strawberryperl --no-progress --yes --limit-output
          }
          if (-not (Test-Path $perl)) {
            throw "Strawberry Perl não disponível para a compilação vendorizada do OpenSSL."
          }
          & $perl -MLocale::Maketext::Simple -e 1
          "PIGE360_STRAWBERRY_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Instalar bibliotecas nativas do Tauri no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Construir aplicativos desktop
        run: bash scripts/desktop/build-all.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-desktop-${{ matrix.label }}
          path: release/artifacts/desktop/**
          if-no-files-found: error

  android:
    name: Android APK e AAB
    needs: [version, validation, signing_preflight]
    if: >-
      ${{ always() && needs.version.outputs.publishable == 'true' &&
          needs.validation.result == 'success' &&
          (needs.version.outputs.distribution_mode == 'homologation' ||
           needs.signing_preflight.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: android-actions/setup-android@v3
      - name: Fixar e expor Android NDK para o Tauri
        shell: bash
        run: |
          ndk_version='27.3.13750724'
          ndk_home="$ANDROID_HOME/ndk/$ndk_version"
          if [ ! -d "$ndk_home" ]; then
            sdkmanager --install "ndk;$ndk_version"
          fi
          test -d "$ndk_home"
          printf 'NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Construir matriz Android no canal selecionado
        env:
          DISTRIBUTION_MODE: ${{ needs.version.outputs.distribution_mode }}
        shell: bash
        run: |
          if [ "$DISTRIBUTION_MODE" = 'homologation' ]; then
            bash scripts/mobile/build-android.sh --app all --profile debug --artifacts apk --verify-signature
          else
            bash scripts/mobile/build-android.sh --app all --profile release --artifacts both
          fi
      - name: Assinar e verificar APKs/AABs de distribuição
        if: needs.version.outputs.distribution_mode == 'store'
        env:
          SIGN_REQUIRED: 'true'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/mobile/sign-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-android
          path: release/artifacts/android/**
          if-no-files-found: error

  ios:
    name: iOS IPA para assinatura local
    needs: [version, validation, signing_preflight]
    if: >-
      ${{ always() && needs.version.outputs.publishable == 'true' &&
          needs.validation.result == 'success' &&
          (needs.version.outputs.distribution_mode == 'homologation' ||
           needs.signing_preflight.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Construir matriz iOS no canal selecionado
        env:
          DISTRIBUTION_MODE: ${{ needs.version.outputs.distribution_mode }}
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_DEVELOPMENT_TEAM }}
        shell: bash
        run: |
          if [ "$DISTRIBUTION_MODE" = 'homologation' ]; then
            bash scripts/mobile/build-ios.sh --mode local-signing
          else
            bash scripts/mobile/build-ios.sh --mode store
          fi
      - name: Assinar e verificar IPAs de distribuição
        if: needs.version.outputs.distribution_mode == 'store'
        env:
          SIGN_REQUIRED: 'true'
          EXPECTED_IOS_ARTIFACTS: '5'
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/mobile/sign-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-ios
          path: release/artifacts/ios/**
          if-no-files-found: error

  release_bundle:
    name: Pacotes auto-hospedados e evidências
    needs: [version, validation, runtime_images]
    if: needs.version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reproduzir evidências que compõem o pacote
        run: |
          python -m pip install -r backend/requirements.lock
          bash scripts/ci/run-all.sh --ci
      - name: Gerar ZIPs de fonte, self-hosted e CI/CD
        run: bash scripts/release/package-local.sh --output-dir release/output
      - uses: actions/upload-artifact@v4
        with:
          name: pige360-${{ needs.version.outputs.version }}-release-bundle
          path: release/output/**
          if-no-files-found: error

  publish:
    name: Criar GitHub Release
    needs: [version, signing_preflight, validation, runtime_images, web_pwa, desktop, android, ios, release_bundle]
    if: >-
      ${{ always() && needs.version.outputs.publishable == 'true' &&
          needs.validation.result == 'success' &&
          needs.runtime_images.result == 'success' &&
          needs.web_pwa.result == 'success' &&
          needs.desktop.result == 'success' &&
          needs.android.result == 'success' &&
          needs.ios.result == 'success' &&
          needs.release_bundle.result == 'success' &&
          (needs.version.outputs.distribution_mode == 'homologation' ||
           (needs.version.outputs.distribution_mode == 'store' &&
            needs.signing_preflight.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pige360-${{ needs.version.outputs.version }}-*
          path: release/publish
          merge-multiple: true
      - name: Consolidar checksums dos assets publicados
        run: |
          find release/publish -type f -print0 | sort -z | xargs -0 sha256sum > "release/publish/PIGE360-${{ needs.version.outputs.version }}-release-assets-SHA256SUMS"
      - name: Registrar notas do pré-lançamento
        env:
          DISTRIBUTION_MODE: ${{ needs.version.outputs.distribution_mode }}
        shell: bash
        run: |
          if [ "$DISTRIBUTION_MODE" = 'homologation' ]; then
            cat > release/RELEASE_NOTES.md <<'EOF'
          ## PIGE360 ${{ needs.version.outputs.version }}

          Pré-lançamento de homologação gerado após a promoção da versão na `main`.

          Inclui: 13 PWAs, instaladores desktop, APKs Android de depuração
          instaláveis e verificados, pacotes self-hosted, fontes, SBOM,
          proveniência e checksums.

          Não realiza deploy SaaS nem publicação em lojas. Os APKs deste canal
          usam a assinatura de depuração do Gradle e destinam-se somente a
          homologação. As IPAs deste canal contêm um bundle arm64 em
          `Payload/<App>.app` para assinatura local. Antes da instalação em
          aparelho físico, aplique no Mac o certificado e o perfil de
          desenvolvimento da sua conta Apple.
          EOF
          else
            cat > release/RELEASE_NOTES.md <<'EOF'
          ## PIGE360 ${{ needs.version.outputs.version }}

          Pré-lançamento de distribuição em loja gerado após a promoção da versão na `main`.

          Inclui: 13 PWAs, instaladores desktop, APKs Android assinados e
          verificáveis, AABs Android assinados para envio à Google Play, IPAs iOS
          assinadas com perfil de provisionamento, pacotes self-hosted, fontes,
          SBOM, proveniência e checksums.
          EOF
          fi
      - name: Publicar tag e GitHub Release imutável
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_RELEASE_ENABLED: 'true'
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_NOTES_FILE: release/RELEASE_NOTES.md
        run: bash scripts/release/publish-github-release.sh release/publish
