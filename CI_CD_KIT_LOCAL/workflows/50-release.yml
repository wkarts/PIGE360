name: 50 · Release SemVer coordenada

'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bump:
        description: Override opcional do incremento SemVer
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      release_tag:
        description: 'Tag imutável de uma release incompleta a retomar (ex.: v1.2.3)'
        required: false
        type: string
      allow_partial_release:
        description: Publicar mesmo com alvos ausentes; exige decisão manual explícita
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: pige360-release-main
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validar fonte promovida
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Executar gates integrais
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.lock
          prerelease_args=()
          requested_version="${REQUESTED_TAG#v}"
          if [ -n "$REQUESTED_TAG" ] && [[ "$requested_version" == *-* || "$requested_version" == *+* ]]; then
            prerelease_args+=(--allow-prerelease)
          fi
          python3 scripts/validation/validate_version_consistency.py --output release/version-consistency.json "${prerelease_args[@]}"
          bash scripts/ci/run-all.sh --ci "${prerelease_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            release/reports/**
            release/*validation*.json
            release/project-validation.json
          if-no-files-found: error
          retention-days: 14

  plan_version:
    name: Planejar versão ou retomar tag
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      bump: ${{ steps.plan.outputs.bump }}
      previous: ${{ steps.plan.outputs.previous }}
      source_version: ${{ steps.plan.outputs.source_version }}
      resume: ${{ steps.plan.outputs.resume }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Resolver metadados do PR promovido
        id: pr
        if: ${{ ! inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')"
          title="$(jq -r '.[0].title // empty' <<<"$pr_json")"
          labels="$(jq -r '[.[0].labels[]?.name] | join(",")' <<<"$pr_json")"
          {
            echo "title=$title"
            echo "labels=$labels"
          } >> "$GITHUB_OUTPUT"
      - name: Calcular próxima versão ou validar retomada
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ steps.pr.outputs.labels }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          FORCE_BUMP: ${{ inputs.force_bump || 'auto' }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [ -n "$REQUESTED_TAG" ]; then
            prerelease_id='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
            semver_tag_re="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${prerelease_id}(\\.${prerelease_id})*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
            [[ "$REQUESTED_TAG" =~ $semver_tag_re ]] || {
              echo "Tag de retomada inválida: $REQUESTED_TAG" >&2
              exit 2
            }
            git rev-parse --verify "${REQUESTED_TAG}^{commit}" >/dev/null
            version="${REQUESTED_TAG#v}"
            source_version="$(tr -d '[:space:]' < VERSION)"
            [ "$source_version" = "$version" ] || {
              echo "VERSION ($source_version) diverge da tag $REQUESTED_TAG." >&2
              exit 2
            }
            if release_json="$(gh release view "$REQUESTED_TAG" --json isDraft 2>/dev/null)"; then
              [ "$(jq -r '.isDraft' <<<"$release_json")" = 'true' ] || {
                echo "A release $REQUESTED_TAG já foi publicada e não será reaberta." >&2
                exit 5
              }
            fi
            {
              echo "version=$version"
              echo "tag=$REQUESTED_TAG"
              echo 'bump=resume'
              echo "previous=$version"
              echo "source_version=$source_version"
              echo 'resume=true'
              if [[ "$version" == *-* ]]; then echo 'prerelease=true'; else echo 'prerelease=false'; fi
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          plan="$(node .github/scripts/compute-next-version.mjs "$latest" "$LABELS" "$PR_TITLE" "$FORCE_BUMP")"
          version="$(jq -r '.version' <<<"$plan")"
          bump="$(jq -r '.bump' <<<"$plan")"
          previous="$(jq -r '.previous' <<<"$plan")"
          source_version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag já existe; use release_tag apenas para retomar um draft imutável." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "bump=$bump"
            echo "previous=$previous"
            echo "source_version=$source_version"
            echo 'resume=false'
            echo 'prerelease=false'
          } >> "$GITHUB_OUTPUT"

  persist_version:
    name: Fixar versão, Cargo.lock e tag imutável
    needs: plan_version
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.final.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan_version.outputs.resume == 'true' && needs.plan_version.outputs.tag || 'main' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Validar tag retomada
        if: needs.plan_version.outputs.resume == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse '${{ needs.plan_version.outputs.tag }}^{commit}')"
          test "$(tr -d '[:space:]' < VERSION)" = "${{ needs.plan_version.outputs.version }}"
          tag='${{ needs.plan_version.outputs.tag }}'
          git cat-file -e "$tag:rust/Cargo.lock"
          missing_locks=0
          manifest_count=0
          while IFS= read -r manifest; do
            manifest_count=$((manifest_count + 1))
            lock="${manifest%Cargo.toml}Cargo.lock"
            if ! git cat-file -e "$tag:$lock"; then
              echo "Cargo.lock ausente na tag retomada: $lock" >&2
              missing_locks=1
            else
              cargo metadata --manifest-path "$manifest" --locked --format-version 1 >/dev/null
            fi
          done < <(git ls-tree -r --name-only "$tag" apps | grep '/src-tauri/Cargo.toml$' | sort)
          test "$manifest_count" -eq 13 || {
            echo "Esperados 13 manifests Tauri na tag; encontrados $manifest_count." >&2
            exit 4
          }
          test "$missing_locks" -eq 0
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 >/dev/null
          git cat-file -e "$tag:tools/pige360-deployer/src-tauri/Cargo.lock"
          cargo metadata --manifest-path tools/pige360-deployer/src-tauri/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Garantir que main não mudou durante o planejamento
        if: needs.plan_version.outputs.resume != 'true'
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          test "$current" = "$GITHUB_SHA" || {
            echo "main avançou durante a preparação ($current != $GITHUB_SHA)." >&2
            exit 1
          }
      - name: Persistir SemVer planejado
        if: needs.plan_version.outputs.resume != 'true'
        run: |
          python3 scripts/release/sync-version.py "${{ needs.plan_version.outputs.version }}" --from-version "${{ needs.plan_version.outputs.source_version }}"
          python3 scripts/validation/validate_version_consistency.py
      - name: Resolver lockfiles Rust antes da tag
        if: needs.plan_version.outputs.resume != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          manifest_count=0
          while IFS= read -r -d '' manifest; do
            manifest_count=$((manifest_count + 1))
            cargo generate-lockfile --manifest-path "$manifest"
            cargo metadata --manifest-path "$manifest" --locked --format-version 1 >/dev/null
          done < <(find apps -type f -path '*/src-tauri/Cargo.toml' -print0 | sort -z)
          test "$manifest_count" -eq 13 || {
            echo "Esperados 13 manifests Tauri; encontrados $manifest_count." >&2
            exit 4
          }
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 >/dev/null
          cargo metadata --manifest-path tools/pige360-deployer/src-tauri/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Criar commit e tag de release atomicamente
        if: needs.plan_version.outputs.resume != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.plan_version.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo 'A preparação não produziu commit de versão/lockfiles.' >&2
            exit 4
          }
          git commit -m "chore(release): $tag [skip release]"
          git tag --annotate "$tag" --message "PIGE360 $tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"
      - name: Registrar SHA canônico
        id: final
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deployer_agent:
    name: PIGE360 Deployer · agente Linux x64
    needs: [plan_version, persist_version]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/pige360-deployer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Validar e compilar agente AMD64
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          python3 scripts/validation/validate_integrated_deployer.py
          npm ci --prefix tools/pige360-deployer --prefer-offline --no-audit --no-fund
          npm --prefix tools/pige360-deployer run validate:deployer
          cargo test --manifest-path tools/pige360-deployer/src-tauri/Cargo.toml --locked --no-default-features --lib
          cargo build --manifest-path tools/pige360-deployer/src-tauri/Cargo.toml --locked --release \
            --no-default-features --bin pige360-deploy-agent --target x86_64-unknown-linux-gnu
          install -D -m 0755 \
            tools/pige360-deployer/src-tauri/target/x86_64-unknown-linux-gnu/release/pige360-deploy-agent \
            build/deployer-agent/pige360-deploy-agent-linux-amd64
          build/deployer-agent/pige360-deploy-agent-linux-amd64 self-test
          version='${{ needs.plan_version.outputs.version }}'
          mkdir -p release/artifacts/deployer-agent
          tar -C build/deployer-agent -czf \
            "release/artifacts/deployer-agent/PIGE360-Deployer-Agent-v${version}-linux-x64.tar.gz" \
            pige360-deploy-agent-linux-amd64
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: build-deployer-agent-linux-x64
          path: build/deployer-agent/pige360-deploy-agent-linux-amd64
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: release-deployer-agent-linux-x64
          path: release/artifacts/deployer-agent/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Registrar status do agente
        if: always()
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/release/write-build-status.mjs
          --output release-status/deployer-agent-linux-x64.status.json
          --id deployer-agent-linux-x64 --label 'Deployer Agent Linux x64'
          --platform linux --arch x64 --target x86_64-unknown-linux-gnu
          --artifact release-deployer-agent-linux-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-deployer-agent-linux-x64
          path: release-status/deployer-agent-linux-x64.status.json
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.build.outcome != 'success'
        run: exit 1

  deployer_desktop:
    name: PIGE360 Deployer · ${{ matrix.label }}
    needs: [plan_version, persist_version, deployer_agent]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: deployer-windows-x64
            label: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            bundles: nsis,msi
            artifact: release-deployer-windows-x64
          - id: deployer-linux-x64
            label: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            bundles: deb,appimage
            artifact: release-deployer-linux-x64
          - id: deployer-macos-x64
            label: macOS Intel x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            bundles: app,dmg
            artifact: release-deployer-macos-x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - name: Instalar dependências Tauri no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/pige360-deployer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: build-deployer-agent-linux-x64
          path: tools/pige360-deployer/src-tauri/embedded
      - name: Construir e empacotar instalador x64
        id: build
        continue-on-error: true
        working-directory: tools/pige360-deployer
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/tools/pige360-deployer/src-tauri/target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          test -s src-tauri/embedded/pige360-deploy-agent-linux-amd64
          npm ci --prefer-offline --no-audit --no-fund
          npm run tauri -- build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          test -d "$bundle"
          mkdir -p "$GITHUB_WORKSPACE/release/artifacts/deployer/${{ matrix.id }}"
          tar -C "$bundle" -czf \
            "$GITHUB_WORKSPACE/release/artifacts/deployer/${{ matrix.id }}/PIGE360-Deployer-v${{ needs.plan_version.outputs.version }}-${{ matrix.id }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: ${{ matrix.artifact }}
          path: release/artifacts/deployer/${{ matrix.id }}/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Registrar status do implantador
        if: always()
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/release/write-build-status.mjs
          --output release-status/${{ matrix.id }}.status.json
          --id ${{ matrix.id }} --label 'Deployer ${{ matrix.label }}'
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --target ${{ matrix.target }} --artifact ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-${{ matrix.id }}
          path: release-status/${{ matrix.id }}.status.json
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.build.outcome != 'success'
        run: exit 1

  container_images:
    name: Publicar imagens OCI SemVer no GHCR
    needs: [plan_version, persist_version]
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - name: Construir conjunto OCI completo da release
        env:
          PIGE360_IMAGE_TAG: ${{ needs.plan_version.outputs.version }}
        run: bash scripts/oci/build-runtime-images.sh all release/artifacts/docker/release
      - name: Validar inventário OCI da release
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          test -s release/artifacts/docker/release/images-manifest.json
          test "$(find release/artifacts/docker/release -maxdepth 1 -name '*.tar' | wc -l)" -eq 13
          sha256sum --check release/artifacts/docker/release/*.tar.sha256
      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar tags SemVer imutáveis
        env:
          PIGE360_IMAGE_TAG: ${{ needs.plan_version.outputs.version }}
          PIGE360_RELEASE_VERSION: ${{ needs.plan_version.outputs.version }}
          PIGE360_PUBLISH_SHA: ${{ needs.persist_version.outputs.release_sha }}
        run: bash scripts/oci/publish-release-images.sh release/artifacts/docker/release
      - name: Validar manifesto e digests da release
        run: |
          jq -e --arg version '${{ needs.plan_version.outputs.version }}' '
            .schema_version == 2 and
            .mode == "release" and
            .release_version == $version and
            .publication_strategy == "two-phase-immutable-first" and
            .cross_image_atomicity == false and
            (.images | length == 13) and
            all(.images[]; (.digest | startswith("sha256:")) and (.channel_refs | length == 2))
          ' release/artifacts/docker/release/ghcr-release-manifest.json >/dev/null
      - name: Subir deployment de produção com imagens SemVer do GHCR
        env:
          PIGE360_GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}
        run: |
          bash scripts/oci/smoke-published-images.sh \
            production '${{ needs.plan_version.outputs.version }}' \
            release/artifacts/docker/registry-smoke/production
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-container-images
          path: |
            release/artifacts/docker/release/images-manifest.json
            release/artifacts/docker/release/ghcr-release-manifest.json
            release/artifacts/docker/registry-smoke/production/**
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: ${{ matrix.label }}
    needs: [plan_version, persist_version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: desktop-windows-x64
            label: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            platform_arch: windows-x64
            artifact: release-desktop-windows-x64
          - id: desktop-windows-x86
            label: Windows x86
            os: windows-2025
            target: i686-pc-windows-msvc
            platform: windows
            arch: x86
            platform_arch: windows-x86
            artifact: release-desktop-windows-x86
          - id: desktop-linux-x64
            label: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            platform_arch: linux-x64
            artifact: release-desktop-linux-x64
          - id: desktop-linux-arm64
            label: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            platform_arch: linux-arm64
            artifact: release-desktop-linux-arm64
          - id: desktop-macos-x64
            label: macOS Intel
            os: macos-15
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            platform_arch: macos-x64
            artifact: release-desktop-macos-x64
          - id: desktop-macos-arm64
            label: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            platform_arch: macos-arm64
            artifact: release-desktop-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: '${{ matrix.target }}'}
      - name: Preparar Perl completo para OpenSSL no Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = Join-Path $env:SystemDrive 'Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --no-progress --yes --limit-output }
          if (-not (Test-Path $perl)) { throw 'Strawberry Perl não disponível.' }
          & $perl -MLocale::Maketext::Simple -e 1
          "PIGE360_STRAWBERRY_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Instalar bibliotecas nativas do Tauri no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Validar tag e construir bundles finais
        id: build
        continue-on-error: true
        env:
          PIGE360_REQUIRE_LOCKED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          bash scripts/desktop/build-all.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: ${{ matrix.artifact }}
          path: release/artifacts/desktop/${{ matrix.platform_arch }}/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Registrar status do alvo
        if: always()
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: >-
          node scripts/release/write-build-status.mjs
          --output release-status/${{ matrix.id }}.status.json
          --id ${{ matrix.id }} --label '${{ matrix.label }}'
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --target ${{ matrix.target }} --artifact ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-${{ matrix.id }}
          path: release-status/${{ matrix.id }}.status.json
          if-no-files-found: error
          retention-days: 14
      - name: Propagar falha após registrar evidência
        if: always() && steps.build.outcome != 'success'
        run: exit 1

  web_pwa:
    name: Web/PWA
    needs: [plan_version, persist_version]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Construir e empacotar 13 PWAs
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          bash scripts/release/package-web-pwa.sh
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: release-web-pwa
          path: release/artifacts/web/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Registrar status do alvo
        if: always()
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/release/write-build-status.mjs
          --output release-status/web-pwa.status.json
          --id web-pwa --label Web/PWA --platform web --arch universal
          --target web --artifact release-web-pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-web-pwa
          path: release-status/web-pwa.status.json
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.build.outcome != 'success'
        run: exit 1

  cloudpanel:
    name: CloudPanel Linux ${{ matrix.arch }}
    needs: [plan_version, persist_version]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cloudpanel-linux-x64
            arch: x64
            platform: linux/amd64
            artifact: release-cloudpanel-linux-x64
          - id: cloudpanel-linux-x86
            arch: x86
            platform: linux/386
            artifact: release-cloudpanel-linux-x86
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Construir runtime OCI da arquitetura
        id: build
        continue-on-error: true
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          work="release/artifacts/cloudpanel/${{ matrix.id }}/images"
          mkdir -p "$work"
          bash scripts/oci/build-runtime-images.sh all "$work"
          test "$(find "$work" -maxdepth 1 -type f -name '*.tar' | wc -l)" -eq 13
          sha256sum --check "$work"/*.tar.sha256
          expected_arch="${{ matrix.platform }}"
          expected_arch="${expected_arch#linux/}"
          test "$(find "$work" -maxdepth 1 -type f -name '*.inspect.json' | wc -l)" -eq 13
          while IFS= read -r -d '' inspect; do
            jq -e --arg expected "$expected_arch" '.[0].Architecture == $expected' "$inspect" >/dev/null
          done < <(find "$work" -maxdepth 1 -type f -name '*.inspect.json' -print0 | sort -z)
          archive="release/artifacts/cloudpanel/${{ matrix.id }}/PIGE360-v${{ needs.plan_version.outputs.version }}-cloudpanel-linux-${{ matrix.arch }}-oci.tar.gz"
          tar -C "$work" -czf "$archive" .
          test -s "$archive"
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: ${{ matrix.artifact }}
          path: release/artifacts/cloudpanel/${{ matrix.id }}/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Registrar status do alvo
        if: always()
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/release/write-build-status.mjs
          --output release-status/${{ matrix.id }}.status.json
          --id ${{ matrix.id }} --label 'CloudPanel Linux ${{ matrix.arch }}'
          --platform cloudpanel-linux --arch ${{ matrix.arch }}
          --target ${{ matrix.platform }} --artifact ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-${{ matrix.id }}
          path: release-status/${{ matrix.id }}.status.json
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.build.outcome != 'success'
        run: exit 1

  android:
    name: ${{ matrix.label }}
    needs: [plan_version, persist_version]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android-arm64-apk
            label: Android APK ARM64
            kind: apk
            profile: debug
            verify: --verify-signature
            extension: apk
            target: aarch64-linux-android
            artifact: release-android-arm64-apk
          - id: android-aab
            label: Android AAB ARM64
            kind: aab
            profile: release
            verify: ''
            extension: aab
            target: android-aab
            artifact: release-android-aab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: android-actions/setup-android@v3
      - name: Instalar Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version='27.3.13750724'
          ndk_home="$ANDROID_HOME/ndk/$ndk_version"
          yes | sdkmanager --licenses >/dev/null || true
          if [ ! -d "$ndk_home" ]; then sdkmanager --install "ndk;$ndk_version"; fi
          test -d "$ndk_home"
          printf 'NDK_HOME=%s\nANDROID_NDK_HOME=%s\n' "$ndk_home" "$ndk_home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Construir artefatos Android de todos os apps compatíveis
        id: build
        continue-on-error: true
        env:
          PIGE360_REQUIRE_LOCKED: 'true'
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          bash scripts/mobile/build-android.sh --app all --profile "${{ matrix.profile }}" --artifacts "${{ matrix.kind }}" --targets aarch64 ${{ matrix.verify }}
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/artifacts/android/*.${{ matrix.extension }}
            release/artifacts/android/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Registrar status do alvo
        if: always()
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/release/write-build-status.mjs
          --output release-status/${{ matrix.id }}.status.json
          --id ${{ matrix.id }} --label '${{ matrix.label }}'
          --platform android --arch arm64 --target ${{ matrix.target }}
          --artifact ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-${{ matrix.id }}
          path: release-status/${{ matrix.id }}.status.json
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.build.outcome != 'success'
        run: exit 1

  ios:
    name: iOS ARM64 IPA não assinado
    needs: [plan_version, persist_version]
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: aarch64-apple-ios}
      - name: Validar Xcode e CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod --version
      - name: Construir .app, .xcarchive e IPA ARM64 sem assinatura
        id: build
        continue-on-error: true
        env:
          PIGE360_REQUIRE_LOCKED: 'true'
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          bash scripts/mobile/build-ios.sh --mode local-signing --app all
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: release-ios-arm64-unsigned-ipa
          path: release/artifacts/ios/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Registrar status do alvo
        if: always()
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/release/write-build-status.mjs
          --output release-status/ios-arm64-unsigned-ipa.status.json
          --id ios-arm64-unsigned-ipa --label 'iOS ARM64 IPA não assinado'
          --platform ios --arch arm64 --target aarch64-apple-ios
          --artifact release-ios-arm64-unsigned-ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-ios-arm64-unsigned-ipa
          path: release-status/ios-arm64-unsigned-ipa.status.json
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.build.outcome != 'success'
        run: exit 1

  release_bundle:
    name: Fonte, self-hosted, servidor e evidências
    needs: [plan_version, persist_version]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Revalidar e gerar pacotes Web/Server
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.persist_version.outputs.release_sha }}"
          python -m pip install -r backend/requirements.lock
          prerelease_args=()
          release_version='${{ needs.plan_version.outputs.version }}'
          if [[ "$release_version" == *-* || "$release_version" == *+* ]]; then
            prerelease_args+=(--allow-prerelease)
          fi
          python3 scripts/validation/validate_version_consistency.py "${prerelease_args[@]}"
          bash scripts/ci/run-all.sh --ci "${prerelease_args[@]}"
          bash scripts/release/package-local.sh --output-dir release/output
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: release-core-web-server
          path: release/output/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Falhar sem ocultar pacote central incompleto
        if: steps.build.outcome != 'success'
        run: exit 1

  publish:
    name: Consolidar GitHub Release
    needs: [plan_version, persist_version, deployer_agent, deployer_desktop, container_images, desktop, web_pwa, cloudpanel, android, ios, release_bundle]
    if: always() && needs.persist_version.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.plan_version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.plan_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan_version.outputs.tag }}
      - name: Criar ou confirmar draft antes da coleta
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.initial.md <<EOF
          ## PIGE360 ${RELEASE_VERSION}

          A matriz coordenada desta tag está em processamento. Enquanto a
          coleta e a política de completude não terminarem, esta release deve
          permanecer em draft e não representa uma distribuição concluída.
          EOF
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            [ "$(jq -r '.isDraft' <<<"$release_json")" = 'true' ] || {
              echo "A release $RELEASE_TAG já está publicada e não será reaberta." >&2
              exit 5
            }
            if [ '${{ needs.plan_version.outputs.prerelease }}' = 'true' ]; then
              gh release edit "$RELEASE_TAG" --prerelease
            fi
          else
            prerelease_args=()
            if [ '${{ needs.plan_version.outputs.prerelease }}' = 'true' ]; then prerelease_args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --draft --verify-tag "${prerelease_args[@]}" --title "PIGE360 $RELEASE_VERSION" --notes-file release-notes.initial.md
          fi
      - uses: actions/setup-node@v4
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false
      - name: Exigir publicação íntegra das imagens de produção
        if: needs.container_images.result != 'success'
        run: |
          echo 'As imagens OCI SemVer não foram publicadas integralmente; release mantida em draft.' >&2
          exit 1
      - name: Coletar somente assets finais, gerar manifesto e checksums
        run: >-
          node scripts/release/collect-release-assets.mjs
          --input artifacts --output release-assets
          --product PIGE360 --version "$RELEASE_VERSION"
      - name: Aplicar política de completude
        id: policy
        env:
          ALLOW_PARTIAL_RELEASE: ${{ inputs.allow_partial_release || false }}
        run: >-
          node scripts/release/enforce-release-policy.mjs
          --status release-assets/RELEASE-STATUS.json
          --allow-partial "$ALLOW_PARTIAL_RELEASE"
          --core-result "${{ needs.release_bundle.result }}"
          --output "$GITHUB_OUTPUT"
      - name: Preparar notas auditáveis
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## PIGE360 ${RELEASE_VERSION}

          Incremento: **${{ needs.plan_version.outputs.bump }}**  
          Referência anterior: **${{ needs.plan_version.outputs.previous }}**

          A distribuição coordenada tenta sempre os 16 alvos: Windows x64/x86,
          Linux x64/ARM64, macOS Intel/Apple Silicon, Web/PWA, CloudPanel Linux
          x64/x86, Android APK/AAB ARM64, iOS ARM64 unsigned, agente Deployer
          Linux x64 e instaladores Deployer Windows/Linux/macOS x64.

          Assinatura e publicação em lojas não são simuladas: permanecem
          condicionadas a credenciais e aos workflows manuais correspondentes.

          Pacote central Web/Server/self-hosted: **${{ needs.release_bundle.result }}**
          Imagens OCI SemVer no GHCR: **${{ needs.container_images.result }}**

          EOF
          cat release-assets/RELEASE-STATUS.md >> release-notes.md
      - name: Atualizar o único draft com o resultado da matriz
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft)"
          [ "$(jq -r '.isDraft' <<<"$release_json")" = 'true' ] || {
            echo "A release $RELEASE_TAG deixou de ser draft durante a execução." >&2
            exit 5
          }
          gh release edit "$RELEASE_TAG" --title "PIGE360 $RELEASE_VERSION" --notes-file release-notes.md
      - name: Enviar assets sem sobrescrever conteúdo divergente
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          remote_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if grep -Fqx -- "$name" <<<"$remote_names"; then
              rm -rf "$tmp"/*
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$tmp"
              cmp -s "$asset" "$tmp/$name" || {
                echo "Asset remoto divergente recusado: $name" >&2
                exit 5
              }
              echo "Asset remoto idêntico preservado: $name"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
      - name: Publicar somente quando permitido
        if: steps.policy.outputs.publish == 'true'
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Resumo da decisão
        if: always()
        shell: bash
        run: |
          {
            echo "## Release $RELEASE_TAG"
            echo
            echo "Decisão: ${{ steps.policy.outputs.decision }}"
            echo
            cat release-assets/RELEASE-STATUS.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Manter matriz incompleta em draft
        if: steps.policy.outputs.publish != 'true'
        run: |
          echo 'Matriz incompleta: a release permaneceu em draft para retomada segura.' >&2
          exit 1

  sync_develop:
    name: Sincronizar versão publicada para develop
    needs: [plan_version, persist_version, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Fast-forward develop para o commit versionado da main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main develop
          git merge --ff-only "${{ needs.persist_version.outputs.release_sha }}"
          git push origin HEAD:develop
