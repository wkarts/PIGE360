name: 33 · iOS app/xcarchive/IPA
'on':
  pull_request:
    paths:
      - 'apps/family-app/**'
      - 'apps/teacher-app/**'
      - 'apps/student-app/**'
      - 'apps/admin-app/**'
      - 'apps/pos-app/**'
      - 'rust/**'
      - 'scripts/mobile/**'
      - '.github/workflows/33-build-ios.yml'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      distribution_mode:
        description: Tipo de IPA a validar
        type: choice
        options: [local-signing, store]
        default: local-signing
      sign:
        description: Assinar para distribuição em loja (exige certificados configurados)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Decidir o modo de empacotamento iOS
        id: ios_gate
        env:
          REQUESTED_MODE: ${{ inputs.distribution_mode || 'local-signing' }}
        shell: bash
        run: |
          case "$REQUESTED_MODE" in
            local-signing)
              echo 'build_ios=true' >> "$GITHUB_OUTPUT"
              echo 'build_mode=local-signing' >> "$GITHUB_OUTPUT"
              echo 'requested_mode=local-signing' >> "$GITHUB_OUTPUT"
              echo '::notice::Será gerado IPA arm64 com Payload para assinatura local; ele não é instalável até receber certificado e provisionamento Apple.'
              ;;
            store)
              echo 'build_ios=true' >> "$GITHUB_OUTPUT"
              echo 'build_mode=local-signing' >> "$GITHUB_OUTPUT"
              echo 'requested_mode=store' >> "$GITHUB_OUTPUT"
              echo '::notice::O build unsigned será executado antes da tentativa condicional de assinatura para loja.'
              ;;
            *)
              echo "::error::Modo iOS inválido: $REQUESTED_MODE"
              exit 2
              ;;
          esac
      - uses: actions/setup-node@v4
        if: steps.ios_gate.outputs.build_ios == 'true'
        with: {node-version: '24', cache: npm, cache-dependency-path: package-lock.json}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ios_gate.outputs.build_ios == 'true'
        with:
          targets: aarch64-apple-ios
      - name: Validar Xcode e CocoaPods
        if: steps.ios_gate.outputs.build_ios == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod --version
      - name: Construir aplicações iOS para homologação manual
        id: build
        continue-on-error: true
        if: steps.ios_gate.outputs.build_ios == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            bash scripts/mobile/build-ios.sh --mode "${{ steps.ios_gate.outputs.build_mode }}" --app family-app
          else
            bash scripts/mobile/build-ios.sh --mode "${{ steps.ios_gate.outputs.build_mode }}"
          fi
      - name: Assinar IPA de distribuição solicitada manualmente
        id: sign
        continue-on-error: true
        if: >-
          github.event_name == 'workflow_dispatch' &&
          steps.ios_gate.outputs.requested_mode == 'store' &&
          inputs.sign &&
          steps.build.outcome == 'success'
        env:
          SIGN_REQUESTED: 'true'
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/mobile/sign-ios.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: ios-manual-${{ steps.ios_gate.outputs.requested_mode }}-${{ github.run_id }}
          path: release/artifacts/ios/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Falhar quando build ou assinatura solicitada falhar
        if: >-
          steps.build.outcome != 'success' ||
          (github.event_name == 'workflow_dispatch' && steps.ios_gate.outputs.requested_mode == 'store' && !inputs.sign) ||
          (github.event_name == 'workflow_dispatch' && steps.ios_gate.outputs.requested_mode == 'local-signing' && inputs.sign) ||
          (github.event_name == 'workflow_dispatch' && steps.ios_gate.outputs.requested_mode == 'store' && inputs.sign && steps.sign.outcome != 'success')
        run: |
          echo 'A matriz iOS não foi concluída; nenhum IPA será apresentado como instalável sem assinatura válida.' >&2
          if [ '${{ steps.ios_gate.outputs.requested_mode }}' = 'store' ] && [ '${{ inputs.sign }}' != 'true' ]; then
            echo 'O modo store exige autorização explícita sign=true e todos os secrets Apple.' >&2
          fi
          if [ '${{ steps.ios_gate.outputs.requested_mode }}' = 'local-signing' ] && [ '${{ inputs.sign }}' = 'true' ]; then
            echo 'Selecione distribution_mode=store para solicitar assinatura Apple.' >&2
          fi
          exit 1
