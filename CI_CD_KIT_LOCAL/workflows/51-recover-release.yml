name: 51 · Retomar release coordenada

'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag imutável e incompleta a reconstruir (ex.: v1.2.3)'
        required: true
        type: string
      source_run_id:
        description: ID opcional do run 50 anterior, usado somente para auditoria
        required: false
        type: string
      allow_partial_release:
        description: Autorizar publicação parcial após a nova tentativa completa
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: pige360-release-recovery
  cancel-in-progress: false

jobs:
  redispatch:
    name: Validar tag e redisparar a matriz completa
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar tag, draft e lockfiles imutáveis
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/main' ] || {
            echo "A retomada deve ser disparada a partir da branch main; recebido $GITHUB_REF." >&2
            exit 2
          }
          prerelease_id='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          semver_tag_re="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${prerelease_id}(\\.${prerelease_id})*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
          [[ "$RELEASE_TAG" =~ $semver_tag_re ]] || {
            echo "Tag inválida: $RELEASE_TAG" >&2
            exit 2
          }
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          version="${RELEASE_TAG#v}"
          [ "$(git show "$RELEASE_TAG:VERSION" | tr -d '[:space:]')" = "$version" ] || {
            echo "VERSION diverge de $RELEASE_TAG." >&2
            exit 3
          }
          git cat-file -e "$RELEASE_TAG:rust/Cargo.lock"
          missing_locks=0
          manifest_count=0
          while IFS= read -r manifest; do
            manifest_count=$((manifest_count + 1))
            lock="${manifest%Cargo.toml}Cargo.lock"
            if ! git cat-file -e "$RELEASE_TAG:$lock"; then
              echo "Cargo.lock ausente na tag: $lock" >&2
              missing_locks=1
            fi
          done < <(git ls-tree -r --name-only "$RELEASE_TAG" apps | grep '/src-tauri/Cargo.toml$' | sort)
          [ "$manifest_count" -eq 13 ] || {
            echo "Esperados 13 manifests Tauri na tag; encontrados $manifest_count." >&2
            exit 3
          }
          [ "$missing_locks" -eq 0 ] || exit 3

          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            [ "$(jq -r '.isDraft' <<<"$release_json")" = 'true' ] || {
              echo "A release $RELEASE_TAG já está publicada e não será reaberta." >&2
              exit 5
            }
          fi

          if [ -n "$SOURCE_RUN_ID" ]; then
            case "$SOURCE_RUN_ID" in *[!0-9]*|'') echo "source_run_id inválido: $SOURCE_RUN_ID" >&2; exit 2 ;; esac
            source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
            [ "$(jq -r '.repository.full_name // empty' <<<"$source")" = "$GITHUB_REPOSITORY" ] || exit 3
            [ "$(jq -r '.path // empty' <<<"$source")" = '.github/workflows/50-release.yml' ] || {
              echo 'source_run_id não pertence ao workflow 50.' >&2
              exit 3
            }
          fi
          {
            echo "tag_sha=$tag_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Redisparar workflow 50 sem reutilizar artefatos antigos
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial_release }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run 50-release.yml \
            --ref main \
            -f "release_tag=$RELEASE_TAG" \
            -f force_bump=auto \
            -f "allow_partial_release=$ALLOW_PARTIAL"
          {
            echo "## Retomada solicitada para $RELEASE_TAG"
            echo
            echo "Commit imutável: \`${{ steps.validate.outputs.tag_sha }}\`"
            echo
            echo 'O workflow 50 reconstruirá os 12 alvos a partir da tag exata.'
            echo 'Nenhum artefato de execução anterior foi publicado ou reaproveitado.'
          } >> "$GITHUB_STEP_SUMMARY"
