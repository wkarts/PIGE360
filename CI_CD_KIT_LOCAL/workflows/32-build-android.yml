name: 32 · Android APK/AAB
'on':
  workflow_dispatch:
    inputs:
      sign: {type: boolean, required: false, default: false}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/mobile/build-android.sh
      - name: Avaliar assinatura Android (opcional)
        env:
          SIGN_REQUESTED: ${{ inputs.sign }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/mobile/sign-android.sh
      - uses: actions/upload-artifact@v4
        with: {name: android-apk-aab, path: release/artifacts/android/**, if-no-files-found: error}
