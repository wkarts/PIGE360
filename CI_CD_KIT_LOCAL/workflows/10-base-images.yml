name: 10 · Imagens base OCI
'on':
  workflow_dispatch:
    inputs:
      enable_remote_registry:
        description: Habilitar envio futuro ao registro
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-local:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [python,node,rust-tauri,runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load --provenance=true --sbom=true -f infra/docker/base/Dockerfile.${ matrix.image } -t pige360-base-${ matrix.image }:1.0.0 .
      - run: docker image inspect pige360-base-${ matrix.image }:1.0.0 > release/base-${ matrix.image }-inspect.json
  remote-publish-disabled:
    if: ${{ inputs.enable_remote_registry == true && vars.REMOTE_REGISTRY_ENABLED == 'true' }}
    needs: build-local
    runs-on: ubuntu-24.04
    environment: remote-registry
    steps:
      - run: echo 'Publicação exige implementação e credenciais do registro escolhido.'
