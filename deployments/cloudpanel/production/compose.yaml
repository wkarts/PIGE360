    image: cloudflare/cloudflared:2025.6.1
    profiles:
    - cloudflare
    command:
    - tunnel
    - --no-autoupdate
    - run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_control_tunnel_token
    networks:
    - pige360-app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    volumes:
    - pige360-secrets:/run/secrets:ro
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
  pige360-cloudflared-tenants:
    image: cloudflare/cloudflared:2025.6.1
    profiles:
    - cloudflare
    command:
    - tunnel
    - --no-autoupdate
    - run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tenant_tunnel_token
    networks:
    - pige360-app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    volumes:
    - pige360-secrets:/run/secrets:ro
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
  pige360-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    profiles:
    - otel
    command:
    - --config=/opt/pige360/config/observability/otel-collector.yaml
    volumes:
    - pige360-config:/opt/pige360/config:ro
    networks:
    - pige360-observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-config-init:
        condition: service_completed_successfully
  pige360-prometheus:
    image: prom/prometheus:v3.4.1
    command:
    - --config.file=/opt/pige360/config/observability/prometheus.yml
    - --storage.tsdb.path=/prometheus
    volumes:
    - pige360-prometheus:/prometheus
    - pige360-config:/opt/pige360/config:ro
    networks:
    - pige360-observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-config-init:
        condition: service_completed_successfully
  pige360-grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PATHS_PROVISIONING: /opt/pige360/config/observability/grafana/provisioning
    volumes:
    - pige360-grafana:/var/lib/grafana
    - pige360-secrets:/run/secrets:ro
    - pige360-config:/opt/pige360/config:ro
    networks:
    - pige360-observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
      pige360-config-init:
        condition: service_completed_successfully
  pige360-loki:
    image: grafana/loki:3.5.1
    command:
    - -config.file=/opt/pige360/config/observability/loki.yaml
    volumes:
    - pige360-loki:/loki
    - pige360-config:/opt/pige360/config:ro
    networks:
    - pige360-observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-config-init:
        condition: service_completed_successfully
  pige360-alloy:
    image: grafana/alloy:v1.19.2
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - /opt/pige360/config/observability/alloy.config
    environment:
      PIGE360_PROJECT_NAME: ${PIGE360_PROJECT_NAME:-pige360}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - pige360-config:/opt/pige360/config:ro
    depends_on:
      pige360-loki:
        condition: service_started
      pige360-config-init:
        condition: service_completed_successfully
    networks:
    - pige360-observability
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
  pige360-gateway:
    image: ${GATEWAY_IMAGE:-nginx:1.27.5-alpine}
    pull_policy: missing
    depends_on:
      pige360-api:
        condition: service_healthy
      pige360-web:
        condition: service_healthy
      pige360-platform-console:
        condition: service_healthy
      pige360-branding-studio:
        condition: service_healthy
      pige360-tenant-download-center:
        condition: service_healthy
      pige360-config-init:
        condition: service_completed_successfully
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /opt/pige360/config/gateway
      PIGE360_BASE_DOMAIN: ${PIGE360_BASE_DOMAIN:-pige360.com.br}
      PLATFORM_API_HOST: ${PLATFORM_API_HOST:-api.pige360.com.br}
      PLATFORM_BRANDING_HOST: ${PLATFORM_BRANDING_HOST:-branding.pige360.com.br}
      PLATFORM_CONSOLE_HOST: ${PLATFORM_CONSOLE_HOST:-console.pige360.com.br}
      PLATFORM_DOWNLOADS_HOST: ${PLATFORM_DOWNLOADS_HOST:-downloads.pige360.com.br}
      PLATFORM_OPS_HOST: ${PLATFORM_OPS_HOST:-ops.pige360.com.br}
    ports:
    - ${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-58080}:8080
    volumes:
    - pige360-config:/opt/pige360/config:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - pige360-app
    - pige360-observability
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /etc/nginx/conf.d:mode=0755
    - /var/cache/nginx:mode=0755
    - /var/run:mode=0755
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
  pige360-readiness:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    networks:
    - pige360-app
    - pige360-data
    profiles:
    - operations
    command:
    - readiness
    volumes:
    - pige360-secrets:/run/secrets:ro
    - pige360-config:/var/lib/pige360/config:ro
    - pige360-operations:/var/lib/pige360/operations
    depends_on:
      pige360-gateway:
        condition: service_healthy
  pige360-bootstrap-admin:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    networks:
    - pige360-app
    - pige360-data
    profiles:
    - operations
    command:
    - bootstrap-admin
    volumes:
    - pige360-secrets:/run/secrets:ro
    - pige360-config:/var/lib/pige360/config:ro
    - pige360-operations:/var/lib/pige360/operations
    depends_on:
      pige360-api:
        condition: service_healthy
  pige360-secret-set:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    profiles:
    - operations
    command:
    - secret-set
    volumes:
    - pige360-secrets:/var/lib/pige360/secrets
    network_mode: none
  pige360-diagnostics:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    networks:
    - pige360-app
    - pige360-data
    profiles:
    - operations
    command:
    - diagnostics
    volumes:
    - pige360-secrets:/run/secrets:ro
    - pige360-config:/var/lib/pige360/config:ro
    - pige360-operations:/var/lib/pige360/operations
  pige360-backup:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    networks:
    - pige360-app
    - pige360-data
    profiles:
    - operations
    command:
    - backup
    volumes:
    - pige360-secrets:/run/secrets:ro
    - pige360-config:/var/lib/pige360/config:ro
    - pige360-operations:/var/lib/pige360/operations
    - pige360-backups:/var/lib/pige360/backups
