# Gerado por scripts/deploy/generate_standalone_deployments.py.
# Deployment service-native: requer somente este YAML e um arquivo .env.
# Ambiente: produção alimentada por tag SemVer imutável do GHCR.

name: ${COMPOSE_PROJECT_NAME:-pige360-production}
services:
  pige360-secrets-init:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    network_mode: none
    user: 0:0
    command:
    - init-secrets
    volumes:
    - pige360-secrets:/var/lib/pige360/secrets
  pige360-config-init:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    network_mode: none
    user: 0:0
    command:
    - init-config
    volumes:
    - pige360-config:/var/lib/pige360/config
  pige360-data-init:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    network_mode: none
    user: 0:0
    command:
    - init-data
    volumes:
    - pige360-tenant-storage:/var/lib/pige360/tenants
    - pige360-operations:/var/lib/pige360/operations
    - pige360-backups:/var/lib/pige360/backups
    - pige360-prometheus:/var/lib/pige360/prometheus
    - pige360-grafana:/var/lib/pige360/grafana
    - pige360-loki:/var/lib/pige360/loki
  pige360-config-validate:
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    env_file:
    - ./.env
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    network_mode: none
    command:
    - validate
    volumes:
    - pige360-secrets:/var/lib/pige360/secrets:ro
    - pige360-config:/var/lib/pige360/config:ro
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
      pige360-config-init:
        condition: service_completed_successfully
      pige360-data-init:
        condition: service_completed_successfully
  pige360-postgres-control:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: platform_control
      POSTGRES_USER: pige360_control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_control_password
    volumes:
    - pige360-control-db:/var/lib/postgresql/data
    - pige360-secrets:/run/secrets:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pige360_control -d platform_control
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
  pige360-postgres-tenants:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: pige360_tenant_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_tenant_password
    volumes:
    - pige360-tenant-dbs:/var/lib/postgresql/data
    - pige360-secrets:/run/secrets:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pige360_tenant_admin -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
  pige360-redis:
    image: redis:8.0.2-bookworm
    command:
    - /bin/sh
    - -ec
    - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
    - pige360-redis:/data
    - pige360-secrets:/run/secrets:ro
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$(cat /run/secrets/redis_password)" ping 2>/dev/null | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
  pige360-rabbitmq:
    image: rabbitmq:4.1.1-management
    hostname: pige360-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pige360
      RABBITMQ_DEFAULT_VHOST: pige360
    entrypoint:
    - /bin/sh
    - -ec
    - export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)"; exec docker-entrypoint.sh rabbitmq-server
    volumes:
    - pige360-rabbitmq:/var/lib/rabbitmq
    - pige360-secrets:/run/secrets:ro
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running
      start_period: 45s
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
    - pige360-data
    - pige360-observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
  pige360-minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    volumes:
    - pige360-minio:/data
    - pige360-secrets:/run/secrets:ro
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    depends_on:
      pige360-secrets-init:
        condition: service_completed_successfully
  pige360-clamav:
    image: clamav/clamav:1.4.2
    profiles:
    - security
    volumes:
    - pige360-clamav:/var/lib/clamav
    healthcheck:
      test:
      - CMD-SHELL
      - printf 'PING\n' | nc -w 3 127.0.0.1 3310 | grep PONG
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
    - pige360-data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
  pige360-minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      pige360-minio:
        condition: service_healthy
      pige360-secrets-init:
        condition: service_completed_successfully
      pige360-config-init:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: http://pige360-minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
    entrypoint:
    - /bin/sh
    - /opt/pige360/config/init-minio.sh
    volumes:
    - pige360-secrets:/run/secrets:ro
    - pige360-config:/opt/pige360/config:ro
    networks:
    - pige360-data
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
  pige360-migrations-control:
    env_file:
    - ./.env
    environment:
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION}
      ALLOWED_PLATFORM_HOSTS: console.platform.local,api.platform.local,pige360-api,${PLATFORM_CONSOLE_HOST:-console.pige360.com.br},${PLATFORM_API_HOST:-api.pige360.com.br},${PLATFORM_BRANDING_HOST:-branding.pige360.com.br},${PLATFORM_DOWNLOADS_HOST:-downloads.pige360.com.br}
      REMOTE_CI_ENABLED: 'false'
      REMOTE_REGISTRY_ENABLED: 'false'
      REMOTE_RELEASE_ENABLED: 'false'
      REMOTE_DEPLOY_ENABLED: 'false'
      APP_JWT_SECRET_FILE: /run/secrets/app_jwt_secret
      APP_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      DATABASE_CONTROL_URL: postgresql+asyncpg://pige360_control@pige360-postgres-control:5432/platform_control
      DATABASE_TENANT_ADMIN_URL: postgresql+asyncpg://pige360_tenant_admin@pige360-postgres-tenants:5432/postgres
      REDIS_URL: redis://pige360-redis:6379/0
      RABBITMQ_URL: amqp://pige360@pige360-rabbitmq:5672/pige360
      MINIO_ENDPOINT: http://pige360-minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://pige360-otel-collector:4317
      DATABASE_CONTROL_PASSWORD_FILE: /run/secrets/postgres_control_password
      DATABASE_TENANT_ADMIN_PASSWORD_FILE: /run/secrets/postgres_tenant_password
      DATABASE_SECRET_KEY_FILE: /run/secrets/database_secret_key
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      WORKER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/worker_context_signing_key
      BUILD_FARM_TOKEN_FILE: /run/secrets/build_farm_token
      PIGE360_BASE_DOMAIN: ${PIGE360_BASE_DOMAIN:-pige360.com.br}
      TENANT_DEFAULT_BASE_DOMAIN: ${TENANT_DEFAULT_BASE_DOMAIN:-pige360.com.br}
      TENANT_CUSTOM_DOMAINS_ENABLED: ${TENANT_CUSTOM_DOMAINS_ENABLED:-true}
      PIGE360_SKIP_MIGRATIONS: ${PIGE360_SKIP_MIGRATIONS:-false}
    depends_on:
      pige360-config-validate:
        condition: service_completed_successfully
      pige360-postgres-control:
        condition: service_healthy
      pige360-postgres-tenants:
        condition: service_healthy
      pige360-minio-init:
        condition: service_completed_successfully
    command:
    - migrate-control
    volumes:
    - pige360-secrets:/run/secrets:ro
    - pige360-tenant-storage:/var/lib/pige360/tenants
    networks:
    - pige360-data
    restart: 'no'
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
  pige360-migrations-tenants:
    env_file:
    - ./.env
    environment:
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION}
      ALLOWED_PLATFORM_HOSTS: console.platform.local,api.platform.local,pige360-api,${PLATFORM_CONSOLE_HOST:-console.pige360.com.br},${PLATFORM_API_HOST:-api.pige360.com.br},${PLATFORM_BRANDING_HOST:-branding.pige360.com.br},${PLATFORM_DOWNLOADS_HOST:-downloads.pige360.com.br}
      REMOTE_CI_ENABLED: 'false'
      REMOTE_REGISTRY_ENABLED: 'false'
      REMOTE_RELEASE_ENABLED: 'false'
      REMOTE_DEPLOY_ENABLED: 'false'
      APP_JWT_SECRET_FILE: /run/secrets/app_jwt_secret
      APP_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      DATABASE_CONTROL_URL: postgresql+asyncpg://pige360_control@pige360-postgres-control:5432/platform_control
      DATABASE_TENANT_ADMIN_URL: postgresql+asyncpg://pige360_tenant_admin@pige360-postgres-tenants:5432/postgres
      REDIS_URL: redis://pige360-redis:6379/0
      RABBITMQ_URL: amqp://pige360@pige360-rabbitmq:5672/pige360
      MINIO_ENDPOINT: http://pige360-minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://pige360-otel-collector:4317
      DATABASE_CONTROL_PASSWORD_FILE: /run/secrets/postgres_control_password
      DATABASE_TENANT_ADMIN_PASSWORD_FILE: /run/secrets/postgres_tenant_password
      DATABASE_SECRET_KEY_FILE: /run/secrets/database_secret_key
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      WORKER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/worker_context_signing_key
      BUILD_FARM_TOKEN_FILE: /run/secrets/build_farm_token
      PIGE360_BASE_DOMAIN: ${PIGE360_BASE_DOMAIN:-pige360.com.br}
      TENANT_DEFAULT_BASE_DOMAIN: ${TENANT_DEFAULT_BASE_DOMAIN:-pige360.com.br}
      TENANT_CUSTOM_DOMAINS_ENABLED: ${TENANT_CUSTOM_DOMAINS_ENABLED:-true}
      PIGE360_SKIP_MIGRATIONS: ${PIGE360_SKIP_MIGRATIONS:-false}
    depends_on:
      pige360-config-validate:
        condition: service_completed_successfully
      pige360-postgres-control:
        condition: service_healthy
      pige360-postgres-tenants:
        condition: service_healthy
      pige360-minio-init:
        condition: service_completed_successfully
      pige360-migrations-control:
        condition: service_completed_successfully
    command:
    - migrate-tenants
    volumes:
    - pige360-secrets:/run/secrets:ro
    - pige360-tenant-storage:/var/lib/pige360/tenants
    networks:
    - pige360-data
    restart: 'no'
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-ops:${PIGE360_IMAGE_TAG:-1.1.2}
    pull_policy: always
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
  pige360-api:
    env_file:
    - ./.env
    image: ${PIGE360_IMAGE_REGISTRY:-ghcr.io/wkarts}/pige360-api:${PIGE360_IMAGE_TAG:-1.1.2}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.1.2}
      ALLOWED_PLATFORM_HOSTS: console.platform.local,api.platform.local,pige360-api,${PLATFORM_CONSOLE_HOST:-console.pige360.com.br},${PLATFORM_API_HOST:-api.pige360.com.br},${PLATFORM_BRANDING_HOST:-branding.pige360.com.br},${PLATFORM_DOWNLOADS_HOST:-downloads.pige360.com.br}
      REMOTE_CI_ENABLED: 'false'
      REMOTE_REGISTRY_ENABLED: 'false'
      REMOTE_RELEASE_ENABLED: 'false'
      REMOTE_DEPLOY_ENABLED: 'false'
      APP_JWT_SECRET_FILE: /run/secrets/app_jwt_secret
      APP_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      DATABASE_CONTROL_URL: postgresql+asyncpg://pige360_control@pige360-postgres-control:5432/platform_control
      DATABASE_TENANT_ADMIN_URL: postgresql+asyncpg://pige360_tenant_admin@pige360-postgres-tenants:5432/postgres
      REDIS_URL: redis://pige360-redis:6379/0
      RABBITMQ_URL: amqp://pige360@pige360-rabbitmq:5672/pige360
      MINIO_ENDPOINT: http://pige360-minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://pige360-otel-collector:4317
      DATABASE_CONTROL_PASSWORD_FILE: /run/secrets/postgres_control_password
      DATABASE_TENANT_ADMIN_PASSWORD_FILE: /run/secrets/postgres_tenant_password
      DATABASE_SECRET_KEY_FILE: /run/secrets/database_secret_key
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      WORKER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/worker_context_signing_key
      BUILD_FARM_TOKEN_FILE: /run/secrets/build_farm_token
      PIGE360_BASE_DOMAIN: ${PIGE360_BASE_DOMAIN:-pige360.com.br}
      TENANT_DEFAULT_BASE_DOMAIN: ${TENANT_DEFAULT_BASE_DOMAIN:-pige360.com.br}
      TENANT_CUSTOM_DOMAINS_ENABLED: ${TENANT_CUSTOM_DOMAINS_ENABLED:-true}
      CONNECT_API_ENABLED: ${CONNECT_API_ENABLED:-false}
      CONNECT_API_BASE_URL: ${CONNECT_API_BASE_URL:-}
      CONNECT_API_META_COMPATIBLE: ${CONNECT_API_META_COMPATIBLE:-true}
      CLOUDFLARE_SAAS_ENABLED: ${CLOUDFLARE_SAAS_ENABLED:-false}
      CLOUDFLARE_TENANT_ZONE_ID: ${CLOUDFLARE_TENANT_ZONE_ID:-}
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      LOKI_INTERNAL_URL: ${LOKI_INTERNAL_URL:-http://pige360-loki:3100}
      APP_ACCESS_TOKEN_MINUTES: ${APP_ACCESS_TOKEN_MINUTES:-15}
      APP_CONTROL_DB_PATH: ${APP_CONTROL_DB_PATH:-/var/lib/pige360/control/platform-control.db}
      APP_DATA_ROOT: ${APP_DATA_ROOT:-/var/lib/pige360}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-false}
      APP_LOGIN_LOCKOUT_MINUTES: ${APP_LOGIN_LOCKOUT_MINUTES:-15}
      APP_LOGIN_MAX_ATTEMPTS: ${APP_LOGIN_MAX_ATTEMPTS:-5}
      APP_REFRESH_TOKEN_DAYS: ${APP_REFRESH_TOKEN_DAYS:-30}
      APP_STORAGE_ROOT: ${APP_STORAGE_ROOT:-/var/lib/pige360/tenants}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://console.pige360.com.br}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      IBPT_API_BASE_URL: ${IBPT_API_BASE_URL:-https://ibpt.wwsoftwares.com.br}
      IBPT_API_UF_PATH: ${IBPT_API_UF_PATH:-/tabela/ibpt/{uf}}
      IBPT_PROVIDER: ${IBPT_PROVIDER:-wwsoftwares}
      IBPT_SYNC_ENABLED: ${IBPT_SYNC_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      INTEGRATION_REMOTE_ENABLED: ${INTEGRATION_REMOTE_ENABLED:-false}
      MAIL_MODE: ${MAIL_MODE:-disabled}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      NOTIFICATION_SCHEDULER_INTERVAL_SECONDS: ${NOTIFICATION_SCHEDULER_INTERVAL_SECONDS:-60}
      OUTBOX_PUBLISH_INTERVAL_SECONDS: ${OUTBOX_PUBLISH_INTERVAL_SECONDS:-5}
      READINESS_REQUIRE_OBJECT_STORAGE: ${READINESS_REQUIRE_OBJECT_STORAGE:-true}
      READINESS_REQUIRE_RABBITMQ: ${READINESS_REQUIRE_RABBITMQ:-true}
      READINESS_REQUIRE_REDIS: ${READINESS_REQUIRE_REDIS:-true}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-5}
      SIGNATURE_INTERNAL_OTP_REQUIRED: ${SIGNATURE_INTERNAL_OTP_REQUIRED:-true}
      SIGNATURE_OTP_MAX_ATTEMPTS: ${SIGNATURE_OTP_MAX_ATTEMPTS:-5}
      SIGNATURE_OTP_TTL_SECONDS: ${SIGNATURE_OTP_TTL_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      TENANT_BRAND_ASSET_MAX_MB: ${TENANT_BRAND_ASSET_MAX_MB:-20}
      TENANT_CUSTOM_DOMAIN_CNAME_TARGET: ${TENANT_CUSTOM_DOMAIN_CNAME_TARGET:-edge.pige360.com.br}
      TENANT_RESERVED_SLUGS: ${TENANT_RESERVED_SLUGS:-www,api,console,ops,branding,downloads,edge,status,assets,cdn,mail,smtp,imap,admin,control,platform}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,172.16.0.0/12}
      WORKFLOW_SLA_INTERVAL_SECONDS: ${WORKFLOW_SLA_INTERVAL_SECONDS:-60}
    depends_on:
      pige360-postgres-control:
        condition: service_healthy
      pige360-postgres-tenants:
        condition: service_healthy
      pige360-redis:
        condition: service_healthy
      pige360-rabbitmq:
        condition: service_healthy
      pige360-minio:
        condition: service_healthy
      pige360-secrets-init:
        condition: service_completed_successfully
      pige360-data-init:
        condition: service_completed_successfully
      pige360-migrations-tenants:
        condition: service_completed_successfully
    volumes:
    - pige360-tenant-storage:/var/lib/pige360/tenants
    - pige360-secrets:/run/secrets:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;request=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/live',headers={'Host':'console.platform.local'});urllib.request.urlopen(request)
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
    - pige360-app
    - pige360-data
    - pige360-observability
    - pige360-build-farm
    restart: unless-stopped
