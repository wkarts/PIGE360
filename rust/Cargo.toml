[workspace]
resolver = "2"
members = [
  "crates/secure-storage",
  "crates/offline-database",
  "crates/sync-engine",
  "crates/device-identity",
  "crates/fiscal-snapshot",
  "crates/printing",
  "crates/native-bridge",
]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2021"
rust-version = "1.77"
license = "LicenseRef-Proprietary"
authors = ["ARGWS / WWSoftwares"]

[workspace.dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.1.1"
hex = "0.4.3"
keyring = "3.6.2"
rand = "0.8.5"
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
tauri = { version = "2.3.1", features = [] }
thiserror = "2.0.11"
time = { version = "0.3.37", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.12.1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
