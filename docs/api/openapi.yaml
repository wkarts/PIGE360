components:
  schemas:
    AcademicPeriodInput:
      properties:
        academic_year_id:
          type: string
          title: Academic Year Id
        name:
          type: string
          maxLength: 120
          minLength: 2
          title: Name
        period_type:
          type: string
          enum:
          - annual
          - semester
          - trimester
          - bimester
          - monthly
          - module
          - custom
          title: Period Type
        sequence:
          type: integer
          maximum: 24.0
          minimum: 1.0
          title: Sequence
        starts_on:
          type: string
          format: date
          title: Starts On
        ends_on:
          type: string
          format: date
          title: Ends On
      type: object
      required:
      - academic_year_id
      - name
      - period_type
      - sequence
      - starts_on
      - ends_on
      title: AcademicPeriodInput
    AcademicYearInput:
      properties:
        institution_id:
          type: string
          title: Institution Id
        name:
          type: string
          title: Name
        starts_on:
          type: string
          format: date
          title: Starts On
        ends_on:
          type: string
          format: date
          title: Ends On
      type: object
      required:
      - institution_id
      - name
      - starts_on
      - ends_on
      title: AcademicYearInput
    ActionInput:
      properties:
        reason:
          type: string
          maxLength: 2000
          minLength: 3
          title: Reason
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        comments:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Comments
      type: object
      required:
      - reason
      - expected_version
      title: ActionInput
    ActivityDecision:
      properties:
        state:
          type: string
          enum:
          - approved
          - rejected
          - additional_information_required
          title: State
        approved_hours:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Approved Hours
          default: '0'
        notes:
          type: string
          maxLength: 2000
          minLength: 3
          title: Notes
      type: object
      required:
      - state
      - notes
      title: ActivityDecision
    ActivityInput:
      properties:
        enrollment_id:
          type: string
          title: Enrollment Id
        category:
          type: string
          maxLength: 100
          minLength: 2
          title: Category
        title:
          type: string
          maxLength: 240
          minLength: 2
          title: Title
        requested_hours:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Requested Hours
        evidence_document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Document Id
      type: object
      required:
      - enrollment_id
      - category
      - title
      - requested_hours
      title: ActivityInput
    AppManifestInput:
      properties:
        tenant_code:
          type: string
          title: Tenant Code
        brand_version:
          type: integer
          minimum: 1.0
          title: Brand Version
        release_channel:
          type: string
          enum:
          - stable
          - beta
          - homologation
          title: Release Channel
          default: stable
        apps:
          additionalProperties:
            $ref: '#/components/schemas/TenantApp'
          type: object
          title: Apps
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
      - tenant_code
      - brand_version
      - apps
      title: AppManifestInput
    ApplicationInput:
      properties:
        process_id:
          type: string
          title: Process Id
        candidate_id:
          type: string
          title: Candidate Id
      type: object
      required:
      - process_id
      - candidate_id
      title: ApplicationInput
    ApplicationStateInput:
      properties:
        state:
          type: string
          enum:
          - under_review
          - waitlisted
          - selected
          - rejected
          - cancelled
          title: State
        reason:
          type: string
          maxLength: 2000
          minLength: 3
          title: Reason
      type: object
      required:
      - state
      - reason
      title: ApplicationStateInput
    AssessmentInput:
      properties:
        academic_period_id:
          type: string
          title: Academic Period Id
        class_group_id:
          type: string
          title: Class Group Id
        component_id:
          type: string
          title: Component Id
        grading_policy_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Grading Policy Id
        title:
          type: string
          maxLength: 180
          minLength: 2
          title: Title
        assessment_type:
          type: string
          maxLength: 50
          minLength: 2
          title: Assessment Type
          default: exam
        weight:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Weight
          default: '1'
        max_score:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Max Score
          default: '10'
        due_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due On
      type: object
      required:
      - academic_period_id
      - class_group_id
      - component_id
      - title
      title: AssessmentInput
    AssessmentPatch:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        title:
          anyOf:
          - type: string
            maxLength: 180
            minLength: 2
          - type: 'null'
          title: Title
        weight:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Weight
        max_score:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Max Score
        due_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due On
        reason:
          type: string
          maxLength: 1000
          minLength: 3
          title: Reason
      type: object
      required:
      - expected_version
      - reason
      title: AssessmentPatch
    AssetEventInput:
      properties:
        event_type:
          type: string
          title: Event Type
        to_location:
          anyOf:
          - type: string
          - type: 'null'
          title: To Location
        responsible_person_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Responsible Person Id
        cost:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Cost
        notes:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Notes
      type: object
      required:
      - event_type
      title: AssetEventInput
    AssetInput:
      properties:
        asset_number:
          type: string
          title: Asset Number
        description:
          type: string
          title: Description
        acquisition_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Acquisition Date
        acquisition_cost:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Acquisition Cost
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        responsible_person_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Responsible Person Id
      type: object
      required:
      - asset_number
      - description
      title: AssetInput
    AttendancePolicyCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 3
          title: Name
        effective_from:
          type: string
          format: date
          title: Effective From
        effective_until:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective Until
        minimum_percentage:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Minimum Percentage
          default: '75'
        status_effects:
          additionalProperties:
            anyOf:
            - type: number
            - type: string
              pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            - type: 'null'
          type: object
          title: Status Effects
        tolerances:
          additionalProperties:
            anyOf:
            - type: integer
            - type: number
            - type: boolean
          type: object
          title: Tolerances
        rules:
          additionalProperties: true
          type: object
          title: Rules
      type: object
      required:
      - name
      - effective_from
      title: AttendancePolicyCreate
    AttendancePolicyVersionInput:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 3
          title: Name
        effective_from:
          type: string
          format: date
          title: Effective From
        effective_until:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective Until
        minimum_percentage:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Minimum Percentage
          default: '75'
        status_effects:
          additionalProperties:
            anyOf:
            - type: number
            - type: string
              pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            - type: 'null'
