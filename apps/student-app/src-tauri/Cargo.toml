[package]
name = "pige360-student-app"
version = "1.0.0"
edition = "2021"

[lib]
name = "pige360_student_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.3.1", features = [] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
pige360-native-bridge = { path = "../../../rust/crates/native-bridge" }

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }
